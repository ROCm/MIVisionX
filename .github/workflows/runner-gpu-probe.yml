# ---------------------------------------------------------------------------
# Runner / GPU mapping probe.
#
# Purpose: the shark39 group was observed handing a gfx1030 runner the
# gfx1100 label (and vice versa). This workflow does NOT build anything —
# each job just lands on a specific runner target, then dumps `rocminfo`
# and `amd-smi` so the ACTUAL GPU on that runner can be compared against the
# label/group it was selected by.
#
# Two selection styles are probed for every cluster:
#   * by arch LABEL  (runs-on: [self-hosted, linux-<host>-gfx<arch>-gpu-rocm])
#     — proves the exact broken claim: does the gfx1100 label land on a 1100?
#   * by GROUP       (runs-on: { group: linux-<host>-runner-group })
#     — shows what the group scheduler actually picks when arch is unpinned.
#
# Read each job's "Probe GPU" step: the line `Expected (from label/group)`
# vs the rocminfo `Name:` / `gfx` ISA line is the swap test.
# ---------------------------------------------------------------------------

name: Runner GPU Probe

on:
  workflow_dispatch:
  push:
    branches: [runner-gpu-probe]

defaults:
  run:
    shell: bash

env:
  ROCM_PATH: /opt/rocm

jobs:
  # =========================================================================
  # shark39 — the cluster where the 1030 <-> 1100 swap was observed.
  # =========================================================================

  shark39-label-gfx1100:
    name: shark39 / label gfx1100
    runs-on: [self-hosted, linux-shark39-gfx1100-gpu-rocm]
    container:
      image: mivisionx/ubuntu-24.04:7.13-gfx1100
      options: --device /dev/kfd --device /dev/dri
    steps:
      - name: Probe GPU
        env:
          EXPECTED: "shark39 gfx1100 (selected by arch label)"
        run: |
          echo "================ Runner / GPU Probe ================"
          echo "Runner name : ${RUNNER_NAME:-unknown}"
          echo "Expected (from label/group): ${EXPECTED}"
          echo "==================================================="
          echo "----- rocminfo (Name / Marketing Name / gfx ISA) -----"
          rocminfo | grep -E 'Name:|Marketing Name:|gfx[0-9]+' || rocminfo
          echo "----- amd-smi -----"
          amd-smi static --asic || amd-smi || true

  shark39-label-gfx1030:
    name: shark39 / label gfx1030
    runs-on: [self-hosted, linux-shark39-gfx1030-gpu-rocm]
