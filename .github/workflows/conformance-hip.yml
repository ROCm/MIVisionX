  # ===========================================================================
  # Coverage Stage — merge profraw from gfx1030 test jobs and generate report.
  # Runs on gfx1100 since it just processes artifacts (no GPU execution).
  # Uses ROCm's bundled llvm-profdata / llvm-cov to match the amdclang
  # toolchain version that emitted the instrumentation.
  # ===========================================================================

  coverage-summary-hip:
    name: Code coverage summary (HIP)
    runs-on:
      group: linux-shark39-runner-group
    container:
      image: mivisionx/ubuntu-24.04:rocm-7.13
      options: --device /dev/kfd --device /dev/dri
    if: always() && needs.build-hip-debug.result == 'success'
    needs:
      - build-hip-debug
      - baseline-hip
      - graph-hip
      - data-objects-hip
      - image-ops-hip
      - vision-color-hip
      - vision-filters-hip
      - vision-arithmetic-hip
      - vision-geometric-hip
      - vision-features-hip
      - vision-statistics-hip
      - vision-pyramid-hip
      - api-tests-hip
      - gdf-tests-hip
      - vision-tests-hip
    steps:
      - uses: actions/checkout@v5

      - name: Install coverage tools
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends python3 lcov

      - name: Validate ROCm
        run: |
          rocminfo
          amd-smi || true

      - name: Download debug build (for libopenvx.so)
        uses: actions/download-artifact@v6
        with:
          name: build-artifacts-hip-debug

      - name: Download all HIP profraw artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: profraw-hip-*
          path: all-profraw
          merge-multiple: true

      - name: Merge profraw files
        run: |
          # Collect paths into a file FIRST. Steps run under bash -eo pipefail,
          # so `find ... | head -50` makes find die with SIGPIPE (exit 141)
          # when there are >50 files and head closes the pipe early — that
          # propagates through pipefail and fails the step. Read display/count
          # from the file instead so nothing closes find's pipe.
          find all-profraw -name '*.profraw' -type f > profraw_list.txt
          PROFRAW_COUNT=$(wc -l < profraw_list.txt)
          echo "Profraw files found (first 50):"
          head -50 profraw_list.txt
          echo "Total profraw files: ${PROFRAW_COUNT}"
          if [ "$PROFRAW_COUNT" -eq 0 ]; then
            echo "::error::No profraw files found — no coverage data collected"
            echo "## Code Coverage (HIP)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "No profraw files were collected from test jobs." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # The LLVM bin dir moved between ROCm images: older images ship it at
          # ${ROCM_PATH}/llvm/bin, the mivisionx image at ${ROCM_PATH}/lib/llvm/bin.
          # Resolve it and export for the report step so both stay in sync.
          LLVM_BIN=""
          for d in "${ROCM_PATH}/lib/llvm/bin" "${ROCM_PATH}/llvm/bin"; do
            if [ -x "${d}/llvm-profdata" ]; then LLVM_BIN="${d}"; break; fi
          done
          if [ -z "${LLVM_BIN}" ]; then
            echo "::error::llvm-profdata not found under ${ROCM_PATH}/lib/llvm/bin or ${ROCM_PATH}/llvm/bin"
            exit 1
          fi
          echo "Using LLVM tools from: ${LLVM_BIN}"
          echo "LLVM_BIN=${LLVM_BIN}" >> "$GITHUB_ENV"
          # --failure-mode=all skips corrupt files instead of aborting.
          "${LLVM_BIN}/llvm-profdata" merge \
            -sparse \
            --failure-mode=all \
            -f profraw_list.txt \
            -o coverage.profdata

      - name: Generate coverage report
        run: |
          LLVM_COV="${LLVM_BIN}/llvm-cov"
          LIBOPENVX="$GITHUB_WORKSPACE/install/lib/libopenvx.so"
          PROFDATA="$GITHUB_WORKSPACE/coverage.profdata"

          "${LLVM_COV}" report "${LIBOPENVX}" \
            -instr-profile="${PROFDATA}" \
            -ignore-filename-regex='(test|conformance)' \
            | tee coverage_report.txt

          "${LLVM_COV}" export "${LIBOPENVX}" \
            -instr-profile="${PROFDATA}" \
            -format=text \
            -ignore-filename-regex='(test|conformance)' \
            > coverage.json

          "${LLVM_COV}" export "${LIBOPENVX}" \
            -instr-profile="${PROFDATA}" \
            -format=lcov \
            -ignore-filename-regex='(test|conformance)' \
            > coverage.lcov

          # lcov/genhtml installed in the "Install coverage tools" step above
          GENHTML_EXTRA_ARGS=()
          if genhtml --version 2>&1 | grep -qE 'LCOV version ([2-9]|[1-9][0-9])'; then
            GENHTML_EXTRA_ARGS+=(--ignore-errors unmapped)
          fi
          genhtml coverage.lcov \
            --output-directory coverage_html \
            --branch-coverage \
            --title "AMD OpenVX Code Coverage (HIP)" \
            --ignore-errors source \
            "${GENHTML_EXTRA_ARGS[@]}" \
            2>&1 || echo "::warning::genhtml had errors"

      - name: Post coverage summary
        if: always()
        run: |
          python3 - "$GITHUB_STEP_SUMMARY" <<'PYEOF'
          import json, sys, os

          summary_file = sys.argv[1]

          json_path = "coverage.json"
          text_path = "coverage_report.txt"

          if not os.path.exists(json_path) and not os.path.exists(text_path):
              with open(summary_file, "a") as f:
                  f.write("## AMD OpenVX Code Coverage (HIP)\n\n")
                  f.write("Coverage report generation failed.\n")
              sys.exit(0)

          if os.path.exists(json_path):
              with open(json_path) as f:
                  data = json.load(f)

              totals = data.get("data", [{}])[0].get("totals", {})
              files = data.get("data", [{}])[0].get("files", [])

              lines = totals.get("lines", {})
              funcs = totals.get("functions", {})
              branches = totals.get("branches", {})
              regions = totals.get("regions", {})

              line_pct = lines.get("percent", 0)
              func_pct = funcs.get("percent", 0)
              branch_pct = branches.get("percent", 0)
              region_pct = regions.get("percent", 0)

              line_covered = lines.get("covered", 0)
              line_total = lines.get("count", 0)
              func_covered = funcs.get("covered", 0)
              func_total = funcs.get("count", 0)
              branch_covered = branches.get("covered", 0)
              branch_total = branches.get("count", 0)

              out = []

              out.append("## AMD OpenVX Code Coverage Report (HIP)")
              out.append("")
              out.append("### Overall Summary")
              out.append("")
              out.append("| Metric | Covered | Total | Coverage |")
              out.append("|:-------|--------:|------:|---------:|")
              out.append(f"| Lines | {line_covered:,} | {line_total:,} | **{line_pct:.2f}%** |")
              out.append(f"| Functions | {func_covered:,} | {func_total:,} | **{func_pct:.2f}%** |")
              out.append(f"| Branches | {branch_covered:,} | {branch_total:,} | **{branch_pct:.2f}%** |")
              out.append(f"| Regions | {regions.get('covered', 0):,} | {regions.get('count', 0):,} | **{region_pct:.2f}%** |")
              out.append("")

              file_data = []
              for fobj in files:
                  fname = fobj.get("filename", "")
                  for prefix in ["/__w/MIVisionX/MIVisionX/amd_openvx/openvx/",
                                 "/home/runner/work/MIVisionX/MIVisionX/amd_openvx/openvx/",
                                 "amd_openvx/openvx/"]:
                      if fname.startswith(prefix):
                          fname = fname[len(prefix):]
                          break

                  fl = fobj.get("summary", {}).get("lines", {})
                  ff = fobj.get("summary", {}).get("functions", {})
                  fb = fobj.get("summary", {}).get("branches", {})

                  if fl.get("count", 0) == 0 and ff.get("count", 0) == 0:
                      continue

                  file_data.append({
                      "name": fname,
                      "lines_covered": fl.get("covered", 0),
                      "lines_total": fl.get("count", 0),
                      "lines_pct": fl.get("percent", 0),
                      "funcs_covered": ff.get("covered", 0),
                      "funcs_total": ff.get("count", 0),
                      "funcs_pct": ff.get("percent", 0),
                      "branches_covered": fb.get("covered", 0),
                      "branches_total": fb.get("count", 0),
                      "branches_pct": fb.get("percent", 0),
                  })

              file_data.sort(key=lambda x: x["name"])

              groups = {}
              for fd in file_data:
                  parts = fd["name"].split("/")
                  group = parts[0] + "/" if len(parts) > 1 else ""
                  groups.setdefault(group, []).append(fd)

              out.append("### File Coverage Details")
              out.append("")
              out.append("| File | Lines | Line % | Functions | Func % | Branches | Branch % |")
              out.append("|:-----|------:|-------:|----------:|-------:|---------:|---------:|")

              for group_name in sorted(groups.keys()):
                  group_files = groups[group_name]
                  if group_name:
                      g_lc = sum(f["lines_covered"] for f in group_files)
                      g_lt = sum(f["lines_total"] for f in group_files)
                      g_fc = sum(f["funcs_covered"] for f in group_files)
                      g_ft = sum(f["funcs_total"] for f in group_files)
                      g_bc = sum(f["branches_covered"] for f in group_files)
                      g_bt = sum(f["branches_total"] for f in group_files)
                      g_lp = (g_lc / g_lt * 100) if g_lt > 0 else 0
                      g_fp = (g_fc / g_ft * 100) if g_ft > 0 else 0
                      g_bp = (g_bc / g_bt * 100) if g_bt > 0 else 0
                      out.append(f"| **{group_name}** | **{g_lc}/{g_lt}** | **{g_lp:.1f}%** | **{g_fc}/{g_ft}** | **{g_fp:.1f}%** | **{g_bc}/{g_bt}** | **{g_bp:.1f}%** |")

                  for fd in group_files:
                      name = fd["name"]
                      lc, lt, lp = fd["lines_covered"], fd["lines_total"], fd["lines_pct"]
                      fc, ft, fp = fd["funcs_covered"], fd["funcs_total"], fd["funcs_pct"]
                      bc, bt, bp = fd["branches_covered"], fd["branches_total"], fd["branches_pct"]
                      out.append(f"| {name} | {lc}/{lt} | {lp:.1f}% | {fc}/{ft} | {fp:.1f}% | {bc}/{bt} | {bp:.1f}% |")

              out.append("")

              with open(summary_file, "a") as f:
                  f.write("\n".join(out) + "\n")
          else:
              with open(text_path) as f:
                  report_text = f.read()
              with open(summary_file, "a") as f:
                  f.write("## AMD OpenVX Code Coverage Report (HIP)\n\n")
                  f.write("```\n")
                  f.write(report_text)
                  f.write("```\n")
          PYEOF

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: code-coverage-report-hip
          path: |
            coverage.profdata
            coverage_report.txt
            coverage.json
            coverage.lcov
            coverage_html/
          retention-days: 30
          if-no-files-found: ignore
