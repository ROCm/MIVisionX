# Rolling performance gate (report/triage.py), modelled on MIVisionX's
# perf_gate.py settings. Every metric a suite registers with vp_perf is
# compared with its median over the last `window_nights` nights on the same
# GPU architecture. Ratios are normalised so that below 1.0 is always worse
# (median/value for times, value/median for throughput).
schema: 1

window_nights: 7
# Nights of history a metric needs before it is gated at all.
min_history: 3
# Below this, a metric is a soft drop (yellow).
metric_floor: 0.90
# Below this, a single metric is a hard regression (red).
hard_metric_floor: 0.75
# A geometric mean of the gated ratios below this is a hard regression (red).
geomean_floor: 0.95
# Metrics whose coefficient of variation over the window exceeds this are
# too noisy to gate: reported, warning only.
cv_cap: 0.10
# Timings under this many milliseconds are warning only.
min_abs_ms: 1.0
