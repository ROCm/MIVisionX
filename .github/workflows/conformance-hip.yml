name: AMD OpenVX CI (HIP)

on:
  push:
    branches: [master, main, develop]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches: [master, main, develop]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

defaults:
  run:
    shell: bash

env:
  ROCM_PATH: /opt/rocm

# Self-hosted GPU runners (gfx1100/gfx1030) are a small shared pool. Cancel
# superseded runs of the same ref so rapid pushes to a PR don't queue up many
# full GPU pipelines and starve the runners. Pushes to default branches keep a
# stable group per ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# ---------------------------------------------------------------------------
# Runner & container assignment
#
#   All jobs use group: linux-shark39-runner-group, which serves RDNA3+ GPUs
#   (gfx1100 / gfx1201) and contains no gfx1030 runners. GitHub schedules each
#   job on whichever scaleset runner in the group is available first, so CI is
#   not blocked when one runner is offline or busy.
#
# Both runners use controller-mode:docker, meaning each job runs inside an
# ephemeral Docker container launched by the runner controller.  The
# container: block below passes the AMD GPU devices required for ROCm/HIP
# execution:
#
#   --device /dev/kfd       AMD GPU kernel fusion driver (compute)
#   --device /dev/dri       DRI render nodes (renderD*)
#
# The container runs as root, so it already has access to these devices —
# no --group-add video/render is needed (and the mivisionx image lacks the
# render group name, which would make docker start fail on --group-add render).
#
# mivisionx/ubuntu-24.04:rocm-20260818 is a multi-arch ROCm 10.1 (nightly
# 20260818) stack (amdclang++, HIP runtime, rocminfo) with device support for
# all supported GPU archs, so it works on whichever runner the job lands on.
# Multi-arch is required because the shark42 group hands out either gfx1100 or
# gfx1201, and a single-family image would fail on the other arch.
#
# Runner group: linux-shark39-runner-group (RDNA3+ GPUs gfx1100 / gfx1201;
# never hands out gfx1030).
#
# HIP_VISIBLE_DEVICES: the runner sets both ROCR_VISIBLE_DEVICES and
# HIP_VISIBLE_DEVICES to the same host GPU index. These stack -- ROCR filters
# HSA to the assigned GPU (now the only device), then HIP re-indexes into that
# single-device set, so on a host-index-1 GPU (e.g. gfx1201) HIP asks for device
# 1 and gets hipErrorNoDevice, failing every graph at vxVerifyGraph. The GPU run
# steps therefore export HIP_VISIBLE_DEVICES=0 so HIP uses index 0 of the
# ROCR-filtered set (the correct, assigned device).
#
# Build-only jobs that do not execute GPU kernels still use the same image
# so the amdclang++ toolchain and ROCm headers are available without any
# extra install step.
# ---------------------------------------------------------------------------

jobs:
  # ===========================================================================
  # Build Stage — three builds run in parallel on whichever runner is free.
  # ===========================================================================

  # Release build of the PR (or push) branch — used by perf-gate
  build-hip:
    name: Build AMD OpenVX (HIP, Release)
    runs-on:
      group: linux-shark39-runner-group
    container:
      image: mivisionx/ubuntu-24.04:rocm-20260818
      options: --device /dev/kfd --device /dev/dri
    steps:
      - uses: actions/checkout@v4
        with:
          # Shallow clone: the build does not use git history.
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends build-essential cmake git python3

      - name: Validate ROCm
        run: |
          rocminfo
          amd-smi || true

      - name: Build AMD OpenVX (HIP backend, Release)
        run: |
          mkdir build && cd build
          cmake .. \
            -DBACKEND=HIP \
            -DGPU_TARGETS="gfx1100;gfx1201" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="${ROCM_PATH}/bin/amdclang" \
            -DCMAKE_CXX_COMPILER="${ROCM_PATH}/bin/amdclang++"
          make -j$(nproc)

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-hip
          path: |
            build/lib/
            amd_openvx/openvx/include/
          retention-days: 1

  # Release build of the merge-target branch — used by perf-gate (PR only)
  build-hip-main:
    name: Build AMD OpenVX (HIP, Release, main)
    if: github.event_name == 'pull_request'
    runs-on:
      group: linux-shark39-runner-group
    container:
      image: mivisionx/ubuntu-24.04:rocm-20260818
      options: --device /dev/kfd --device /dev/dri
    steps:
      - name: Checkout merge target ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          # Shallow: this job only builds the base ref for the perf baseline and
          # never uses git history (no git-based versioning in the build), so a
          # full-history clone is unnecessary and slow.
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends build-essential cmake git python3

      - name: Validate ROCm
        run: |
          rocminfo
          amd-smi || true

      - name: Build AMD OpenVX (HIP backend)
        run: |
          mkdir build && cd build
          cmake .. \
            -DBACKEND=HIP \
            -DGPU_TARGETS="gfx1100;gfx1201" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="${ROCM_PATH}/bin/amdclang" \
            -DCMAKE_CXX_COMPILER="${ROCM_PATH}/bin/amdclang++"
          make -j$(nproc)

      - name: Upload main build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-hip-main
          path: |
            build/lib/
            amd_openvx/openvx/include/
          retention-days: 1

  # Debug build with LLVM coverage instrumentation — downloaded by gfx1030 test jobs.
  # amdclang supports -fprofile-instr-generate / -fcoverage-mapping so the
  # profraw flow is identical to the CPU workflow.
  build-hip-debug:
    name: Build AMD OpenVX (HIP, Debug + Coverage)
    runs-on:
      group: linux-shark39-runner-group
    container:
      image: mivisionx/ubuntu-24.04:rocm-20260818
      options: --device /dev/kfd --device /dev/dri
    steps:
      - uses: actions/checkout@v4
        with:
          # Shallow clone: the build does not use git history.
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends build-essential cmake git git-lfs python3

      - name: Validate ROCm
        run: |
          rocminfo
          amd-smi || true

      - name: Build and install AMD OpenVX (HIP, Debug + Coverage)
        run: |
          mkdir build && cd build
          # Build device code only for the archs the shark42 group runs on
          # (gfx1100 / gfx1201). The default fat binary covers ~14 archs, which
          # is what bloats the debug artifact (and its download in every test
          # job); limiting to the runner archs shrinks it substantially.
          cmake .. \
            -DBACKEND=HIP \
            -DGPU_TARGETS="gfx1100;gfx1201" \
            -DCODE_COVERAGE=ON \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER="${ROCM_PATH}/bin/amdclang" \
            -DCMAKE_CXX_COMPILER="${ROCM_PATH}/bin/amdclang++" \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install"
          make -j$(nproc)
          make install

      - name: Build API tests
        run: |
          API_TESTS=(
            canny channel_extract color_convert accumulate
            graph graph_api tensor_api data_objects user_kernel
            tensor_advanced threshold_query graph_import vxu_api
            coverage_boost vision_coverage pipelining_api
          )
          # libopenvx.so (HIP backend) has unresolved HIP runtime symbols
          # (e.g. hipSetDevice@hip_4.2) that must be satisfied by
          # libamdhip64.so from the real ROCm at ${ROCM_PATH}/lib. The test
          # CMakeLists only links `openvx`, so append the HIP runtime via
          # CMAKE_CXX_STANDARD_LIBRARIES — this lands at the END of the link
          # line (after libopenvx) where single-pass ld can resolve from it.
          for test_dir in "${API_TESTS[@]}"; do
            echo "::group::Building ${test_dir}"
            mkdir -p build/api_tests/${test_dir}
            cmake -S tests/openvx_api_tests/${test_dir} \
                  -B build/api_tests/${test_dir} \
                  -DROCM_PATH="$GITHUB_WORKSPACE/install" \
                  -DCMAKE_STANDARD_LIBRARIES="-L${ROCM_PATH}/lib -lamdhip64" \
                  -DCMAKE_CXX_STANDARD_LIBRARIES="-L${ROCM_PATH}/lib -lamdhip64"
            cmake --build build/api_tests/${test_dir} -j$(nproc)
            echo "::endgroup::"
          done

      - name: Clone and build OpenVX CTS
        run: |
          git clone --depth 1 -b openvx_1.3.2 https://github.com/KhronosGroup/OpenVX-cts.git
          cd OpenVX-cts
          git lfs pull
          mkdir -p build && cd build
          # vx_test_conformance links libopenvx.so (HIP backend), which pulls
          # in HIP runtime symbols (e.g. hipMemcpyHtoD@hip_4.2) from
          # libamdhip64.so in ${ROCM_PATH}/lib. Append the HIP runtime at the
          # END of the link line (after libopenvx) via *_STANDARD_LIBRARIES so
          # single-pass ld can resolve from it; -rpath-link silences the
          # libamdhip64.so.7 soname warning. The CTS executable is C.
          # Build the CTS at -O2, not its default -O3. amdclang (LLVM) at -O3
          # miscompiles the CTS harness with this ROCm, so pin -O2 (the level
          # the CTS itself downgrades -O3 to in cmake/openvx.cmake). We build
          # Release and force -O2 explicitly via the per-config flags so it
          # holds regardless of that internal replace.
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS_RELEASE="-O2 -DNDEBUG" \
            -DCMAKE_CXX_FLAGS_RELEASE="-O2 -DNDEBUG" \
            -DCMAKE_C_COMPILER="${ROCM_PATH}/bin/amdclang" \
            -DCMAKE_CXX_COMPILER="${ROCM_PATH}/bin/amdclang++" \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DOPENVX_INCLUDES="$GITHUB_WORKSPACE/amd_openvx/openvx/include" \
            -DOPENVX_LIBRARIES="$GITHUB_WORKSPACE/install/lib/libopenvx.so;$GITHUB_WORKSPACE/install/lib/libvxu.so;pthread;dl;m;rt" \
            -DOPENVX_CONFORMANCE_VISION=ON \
            -DOPENVX_USE_PIPELINING=ON \
            -DOPENVX_USE_STREAMING=ON \
            -DCMAKE_C_STANDARD_LIBRARIES="-L${ROCM_PATH}/lib -lamdhip64" \
            -DCMAKE_CXX_STANDARD_LIBRARIES="-L${ROCM_PATH}/lib -lamdhip64" \
            -DCMAKE_EXE_LINKER_FLAGS="-Wl,-rpath-link,${ROCM_PATH}/lib"
          make -j$(nproc)

      - name: Strip debug symbols (keep coverage sections)
        run: |
          # Source-based coverage lives in __llvm_covmap / __llvm_prf_* sections,
          # not DWARF, so --strip-debug shrinks the artifact without affecting
          # llvm-cov. Validated: coverage report is identical post-strip.
          strip --strip-debug install/lib/libopenvx.so* install/lib/libvxu.so* 2>/dev/null || true
          strip --strip-debug install/lib/libvx_rpp.so* 2>/dev/null || true
          strip --strip-debug install/bin/runvx 2>/dev/null || true
          strip --strip-debug OpenVX-cts/build/bin/vx_test_conformance 2>/dev/null || true
          strip --strip-debug OpenVX-cts/build/lib/*.so* 2>/dev/null || true

      - name: Pack test bundle
        run: |
          # Ship one tarball rather than the raw tree. upload-artifact cannot
          # represent symlinks, so it would expand libopenvx.so, .so.1 and
          # .so.1.3.2 into three identical copies (same for libvxu) — ~74 MB of
          # duplication on its own, and ~1800 individual files for each of the
          # 16 consuming jobs to fetch and write. tar keeps the symlinks and
          # turns the download into a single stream. It also makes truncation
          # loud: a short tarball fails to extract instead of silently leaving
          # part of test_data missing and surfacing as a bogus test failure.
          tar -czf test-bundle-hip.tar.gz \
            install/ \
            build/api_tests/ \
            OpenVX-cts/build/bin/vx_test_conformance \
            OpenVX-cts/build/lib/ \
            OpenVX-cts/test_data/
          ls -lh test-bundle-hip.tar.gz

      - name: Upload debug build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-hip-debug
          path: test-bundle-hip.tar.gz
          # Already gzipped; re-compressing in the zip only costs time.
          compression-level: 0
          retention-days: 1

  # ===========================================================================
  # Performance Stage — gfx1100 only (PR only).
  # Compares PR vs merge-target on the same GPU runner.
  # ===========================================================================

  perf-gate-hip:
    name: Perf gate HIP (PR vs main)
    if: github.event_name == 'pull_request'
    runs-on:
      group: linux-shark39-runner-group
    container:
      image: mivisionx/ubuntu-24.04:rocm-20260818
      options: --device /dev/kfd --device /dev/dri
    env:
      # 40 vision kernels with a stable 1:1 GPU implementation — excludes
      # LaplacianPyramid / LaplacianReconstruct / LaplacianReconstruct_S16
      # which have a known HIP synchronisation bug causing 200-300ms outliers
      # that would swamp the perf gate CV% and produce false regressions.
      PARITY_KERNELS: "And,Or,Xor,Not,AbsDiff,Add,Subtract,Multiply,Box3x3,Gaussian3x3,Median3x3,Erode3x3,Dilate3x3,Sobel3x3,CustomConvolution,NonLinearFilter,ColorConvert_RGB2IYUV,ChannelExtract,ChannelCombine,ConvertDepth,ScaleImage_Half,WarpAffine,WarpPerspective,Remap,Histogram,EqualizeHist,MeanStdDev,MinMaxLoc,IntegralImage,GaussianPyramid,HalfScaleGaussian,CannyEdgeDetector,HarrisCorners,FastCorners,OpticalFlowPyrLK,Magnitude,Phase,TableLookup,Threshold_Binary,WeightedAverage"
    needs:
      - build-hip
      - build-hip-main
    steps:
      - name: Checkout repo (for perf_gate.py script)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends build-essential cmake git python3

      - name: Validate ROCm
        run: |
          rocminfo
          amd-smi || true

      - name: Download PR build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-hip
          path: ${{ github.workspace }}/pr-pkg

      - name: Download main build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-hip-main
          path: ${{ github.workspace }}/main-pkg

      - name: Clone openvx-mark
        run: |
          git clone --depth 1 https://github.com/kiritigowda/openvx-mark.git \
            $GITHUB_WORKSPACE/openvx-mark

      - name: Build openvx-mark against PR
        run: |
          mkdir -p $GITHUB_WORKSPACE/openvx-mark/build-pr
          cd $GITHUB_WORKSPACE/openvx-mark/build-pr
          cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="${ROCM_PATH}/bin/amdclang" \
            -DCMAKE_CXX_COMPILER="${ROCM_PATH}/bin/amdclang++" \
            -DOPENVX_INCLUDES=$GITHUB_WORKSPACE/pr-pkg/amd_openvx/openvx/include \
            -DOPENVX_LIB_DIR=$GITHUB_WORKSPACE/pr-pkg/build/lib \
            ..
          cmake --build . -j$(nproc)

      - name: Build openvx-mark against main
        run: |
          mkdir -p $GITHUB_WORKSPACE/openvx-mark/build-main
          cd $GITHUB_WORKSPACE/openvx-mark/build-main
          cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="${ROCM_PATH}/bin/amdclang" \
            -DCMAKE_CXX_COMPILER="${ROCM_PATH}/bin/amdclang++" \
            -DOPENVX_INCLUDES=$GITHUB_WORKSPACE/main-pkg/amd_openvx/openvx/include \
            -DOPENVX_LIB_DIR=$GITHUB_WORKSPACE/main-pkg/build/lib \
            ..
          cmake --build . -j$(nproc)

      - name: Bench PR (warmup + measure)
        run: |
          cd $GITHUB_WORKSPACE/openvx-mark/build-pr
          export LD_LIBRARY_PATH=$GITHUB_WORKSPACE/pr-pkg/build/lib:${ROCM_PATH}/lib
          export HIP_VISIBLE_DEVICES=0  # ROCR_VISIBLE_DEVICES already pins the assigned GPU; the runner also sets HIP_VISIBLE_DEVICES to the same host index, which stacks and yields hipErrorNoDevice on index-1 GPUs. After ROCR filtering the device is index 0 for HIP.
          export AGO_DEFAULT_TARGET=GPU
          ./openvx-mark --validate-timing
          ./openvx-mark --kernel "$PARITY_KERNELS" --skip-pipelines \
            --resolution 4K --iterations 100 --warmup 10 --threads 1

      - name: Bench main (warmup + measure)
        run: |
          cd $GITHUB_WORKSPACE/openvx-mark/build-main
          export LD_LIBRARY_PATH=$GITHUB_WORKSPACE/main-pkg/build/lib:${ROCM_PATH}/lib
          export HIP_VISIBLE_DEVICES=0  # ROCR_VISIBLE_DEVICES already pins the assigned GPU; the runner also sets HIP_VISIBLE_DEVICES to the same host index, which stacks and yields hipErrorNoDevice on index-1 GPUs. After ROCR filtering the device is index 0 for HIP.
          export AGO_DEFAULT_TARGET=GPU
          ./openvx-mark --validate-timing
          ./openvx-mark --kernel "$PARITY_KERNELS" --skip-pipelines \
            --resolution 4K --iterations 100 --warmup 10 --threads 1

      - name: Run perf gate
        run: |
          set -euo pipefail
          PR=$GITHUB_WORKSPACE/openvx-mark/build-pr/benchmark_results/benchmark_results.json
          MAIN=$GITHUB_WORKSPACE/openvx-mark/build-main/benchmark_results/benchmark_results.json
          if [ ! -f "$PR" ] || [ ! -f "$MAIN" ]; then
            echo "::error::Missing benchmark JSONs (PR=$PR, MAIN=$MAIN)."
            ls -la "$(dirname "$PR")" "$(dirname "$MAIN")" 2>/dev/null || true
            exit 1
          fi

          # --min-abs-ms 1.0: on the GPU at 4K these vision kernels run
          # sub-millisecond, where a ~0.1ms run-to-run jitter swing reads as a
          # 10%+ ratio and trips the kernel floor with a false regression.
          # Kernels whose slower side is under 1ms stay visible and counted in
          # the geomean but are warn-only, never merge-blocking.
          python3 $GITHUB_WORKSPACE/.github/scripts/perf_gate.py \
            "$MAIN" "$PR" \
            --geomean-floor 0.95 \
            --kernel-floor 0.90 \
            --warn-floor 0.95 \
            --max-cv 10.0 \
            --min-abs-ms 1.0 \
            --summary-out "$GITHUB_STEP_SUMMARY"

      - name: Post PR benchmark summary
        if: always()
        run: |
          PR=$GITHUB_WORKSPACE/openvx-mark/build-pr/benchmark_results/benchmark_results.json
          if [ ! -f "$PR" ]; then
            echo "_No PR benchmark results found._" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 - "$PR" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          with open(sys.argv[1]) as f:
              report = json.load(f)
          results = report.get("results", [])
          if not results:
              print("_No benchmark results._")
              sys.exit(0)
          print()
          print("---")
          print("## PR Benchmark Summary (HIP / gfx1100)")
          print()
          si = report.get("system", {})
          if si:
              print(f'**Runner:** {si.get("cpu_model", "N/A")} '
                    f'({si.get("cpu_cores", "?")} cores, '
                    f'{si.get("ram_gb", "?")} GB RAM)')
              print()
          print("| Kernel | Mode | Res | MP/s | Median (ms) | CV% | Verified |")
          print("|:---|---|---|---:|---:|---:|:---:|")
          for r in sorted(results, key=lambda x: x.get("name", "")):
              wc = r.get("wall_clock", {}) or {}
              v = "PASS" if r.get("verified", False) else "FAIL"
              print(f'| `{r.get("name","")}` '
                    f'| {r.get("mode","")} '
                    f'| {r.get("resolution","")} '
                    f'| {r.get("megapixels_per_sec", 0):.2f} '
                    f'| {wc.get("median_ms", 0):.3f} '
                    f'| {wc.get("cv_percent", 0):.2f} '
                    f'| {v} |')
          print()
          PY

      - name: Upload PR benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-gate-hip-results-pr
          path: ${{ github.workspace }}/openvx-mark/build-pr/benchmark_results/
          if-no-files-found: ignore

      - name: Upload main benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-gate-hip-results-main
          path: ${{ github.workspace }}/openvx-mark/build-main/benchmark_results/
          if-no-files-found: ignore

  # ===========================================================================
  # Test Stage — all jobs run against the debug+coverage build.
  # Each suite runs TWICE: once with AGO_DEFAULT_TARGET=CPU and once with
  # AGO_DEFAULT_TARGET=GPU (local tests use the equivalent runvx -affinity via
  # the script --backend_type/--hardware_mode flags). The HIP build compiles and
  # instruments BOTH the CPU HAF kernels and the HIP kernels, so running only the
  # GPU target left every CPU-path line uncovered and understated HIP coverage.
  # Exercising both targets covers both code paths; both are hard gates.
  # Each job uploads profraw files for the coverage-summary-hip job.
  # ===========================================================================

  # --- CTS Tests ---

  baseline-hip:
    name: Baseline (HIP)
    runs-on:
      group: linux-shark39-runner-group
    container:
      image: mivisionx/ubuntu-24.04:rocm-20260818
      options: --device /dev/kfd --device /dev/dri
    needs: build-hip-debug
    steps:
      # No checkout: this job only runs the prebuilt CTS from the artifact.
      - name: Download debug build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-hip-debug
      - name: Unpack test bundle
        run: tar -xzf test-bundle-hip.tar.gz
      - name: Validate ROCm
        run: |
          rocminfo
          amd-smi || true
      - name: Run baseline tests
        run: |
          mkdir -p profraw
          chmod +x OpenVX-cts/build/bin/vx_test_conformance
          cd OpenVX-cts/build
          export LD_LIBRARY_PATH=$GITHUB_WORKSPACE/install/lib:${ROCM_PATH}/lib:$GITHUB_WORKSPACE/OpenVX-cts/build/lib
          export VX_TEST_DATA_PATH=$GITHUB_WORKSPACE/OpenVX-cts/test_data/
          export HIP_VISIBLE_DEVICES=0  # ROCR_VISIBLE_DEVICES already pins the assigned GPU; the runner also sets HIP_VISIBLE_DEVICES to the same host index, which stacks and yields hipErrorNoDevice on index-1 GPUs. After ROCR filtering the device is index 0 for HIP.
          export AGO_LOG_STDERR=1
          export LLVM_PROFILE_FILE=$GITHUB_WORKSPACE/profraw/baseline_%p.profraw
          # Run each suite on both AGO targets. In the HIP build the CPU HAF
          # kernels and the HIP kernels are both compiled/instrumented, so
          # exercising CPU and GPU covers both code paths (not just GPU).
          for target in CPU GPU; do
            echo "::group::baseline (AGO_DEFAULT_TARGET=$target)"
            AGO_DEFAULT_TARGET=$target timeout 300 ./bin/vx_test_conformance --filter="GraphBase.*:Logging.*:SmokeTestBase.*:SmokeTest.*:TargetBase.*:Target.*"
            echo "::endgroup::"
          done
      - name: Upload profraw
        # Coverage data is best-effort: a transient GitHub artifact-service
        # upload timeout must not fail an otherwise-passing test job (the
        # coverage-summary step tolerates missing profraw via --failure-mode=all).
        if: always()
