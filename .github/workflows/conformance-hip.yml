          export LLVM_PROFILE_FILE=$GITHUB_WORKSPACE/profraw/pipelining_%p.profraw
          for target in CPU GPU; do
            echo "::group::pipelining (AGO_DEFAULT_TARGET=$target)"
            AGO_DEFAULT_TARGET=$target timeout 1800 ./bin/vx_test_conformance --filter="GraphPipeline.*"
            echo "::endgroup::"
          done
      - name: Upload profraw
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: profraw-hip-pipelining
          path: profraw/
          if-no-files-found: ignore

  streaming-hip:
    name: KHR EXT - Streaming (HIP)
    runs-on:
      group: linux-shark39-runner-group
    container:
      image: mivisionx/ubuntu-24.04:rocm-20260818
      options: --device /dev/kfd --device /dev/dri
    needs: build-hip-debug
    steps:
      - name: Download debug build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-hip-debug
      - name: Unpack test bundle
        run: tar -xzf test-bundle-hip.tar.gz
      - name: Validate ROCm
        run: |
          rocminfo
          amd-smi || true
      - name: Run streaming tests
        run: |
          mkdir -p profraw
          chmod +x OpenVX-cts/build/bin/vx_test_conformance
          cd OpenVX-cts/build
          export LD_LIBRARY_PATH=$GITHUB_WORKSPACE/install/lib:${ROCM_PATH}/lib:$GITHUB_WORKSPACE/OpenVX-cts/build/lib
          export VX_TEST_DATA_PATH=$GITHUB_WORKSPACE/OpenVX-cts/test_data/
          export HIP_VISIBLE_DEVICES=0  # ROCR_VISIBLE_DEVICES already pins the assigned GPU; the runner also sets HIP_VISIBLE_DEVICES to the same host index, which stacks and yields hipErrorNoDevice on index-1 GPUs. After ROCR filtering the device is index 0 for HIP.
          export AGO_LOG_STDERR=1
          export LLVM_PROFILE_FILE=$GITHUB_WORKSPACE/profraw/streaming_%p.profraw
          for target in CPU GPU; do
            echo "::group::streaming (AGO_DEFAULT_TARGET=$target)"
            AGO_DEFAULT_TARGET=$target timeout 900 ./bin/vx_test_conformance --filter="GraphStreaming.*"
            echo "::endgroup::"
          done
      - name: Upload profraw
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: profraw-hip-streaming
          path: profraw/
          if-no-files-found: ignore

  # --- Local Tests (API + GDF) ---

  api-tests-hip:
    name: API tests (HIP)
    runs-on:
      group: linux-shark39-runner-group
    container:
      image: mivisionx/ubuntu-24.04:rocm-20260818
      options: --device /dev/kfd --device /dev/dri
    needs: build-hip-debug
    steps:
      # No checkout: this job only runs the prebuilt API tests from the artifact.
      - name: Download debug build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-hip-debug
      - name: Unpack test bundle
        run: tar -xzf test-bundle-hip.tar.gz
      - name: Validate ROCm
        run: |
          rocminfo
          amd-smi || true
      - name: Run API tests
        run: |
          mkdir -p profraw
          export INSTALL_PATH=$GITHUB_WORKSPACE/install
          export LD_LIBRARY_PATH=$INSTALL_PATH/lib:${ROCM_PATH}/lib
          export HIP_VISIBLE_DEVICES=0  # ROCR_VISIBLE_DEVICES already pins the assigned GPU; the runner also sets HIP_VISIBLE_DEVICES to the same host index, which stacks and yields hipErrorNoDevice on index-1 GPUs. After ROCR filtering the device is index 0 for HIP.
          export LLVM_PROFILE_FILE=$GITHUB_WORKSPACE/profraw/api_%p.profraw

          FAILED_TESTS=()
          API_EXECUTABLES=(
            "canny:openvx_canny"
            "channel_extract:openvx_channel_extract"
            "color_convert:openvx_color_convert"
            "accumulate:openvx_accum"
            "graph:openvx_graph"
            "graph_api:openvx_graph_api"
            "tensor_api:openvx_tensor_api"
            "data_objects:openvx_data_objects_api"
            "user_kernel:openvx_user_kernel_api"
            "tensor_advanced:openvx_tensor_advanced_api"
            "threshold_query:openvx_threshold_query_api"
            "graph_import:openvx_graph_import_api"
            "vxu_api:openvx_vxu_api"
            "coverage_boost:openvx_coverage_boost"
            "vision_coverage:openvx_vision_coverage"
            "pipelining_api:openvx_pipelining_api"
          )
          # Run the API test set on both AGO targets. In the HIP build the CPU
          # HAF kernels and the HIP kernels are both compiled/instrumented, so
          # exercising CPU and GPU covers both code paths (not just GPU).
          for target in CPU GPU; do
            export AGO_DEFAULT_TARGET=$target
            for entry in "${API_EXECUTABLES[@]}"; do
              dir="${entry%%:*}"
              exe="${entry##*:}"
              echo "::group::Running ${exe} (AGO_DEFAULT_TARGET=$target)"
              chmod +x build/api_tests/${dir}/${exe}
              if ! ./build/api_tests/${dir}/${exe}; then
                echo "::error::${exe} FAILED (target=$target)"
                FAILED_TESTS+=("${exe}[${target}]")
              fi
              echo "::endgroup::"
            done
          done
          if [ ${#FAILED_TESTS[@]} -ne 0 ]; then
            echo "::error::The following API tests failed: ${FAILED_TESTS[*]}"
            exit 1
          fi
      - name: Upload profraw
        # Coverage data is best-effort: a transient GitHub artifact-service
        # upload timeout must not fail an otherwise-passing test job (the
        # coverage-summary step tolerates missing profraw via --failure-mode=all).
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: profraw-hip-api-tests
          path: profraw/
          if-no-files-found: ignore

  gdf-tests-hip:
    name: GDF tests (HIP)
    runs-on:
      group: linux-shark39-runner-group
    container:
      image: mivisionx/ubuntu-24.04:rocm-20260818
      options: --device /dev/kfd --device /dev/dri
    needs: build-hip-debug
    steps:
      - uses: actions/checkout@v4
      - name: Download debug build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-hip-debug
      - name: Unpack test bundle
        run: tar -xzf test-bundle-hip.tar.gz
      - name: Install python3
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends python3
      - name: Validate ROCm
        run: |
          rocminfo
          amd-smi || true
      - name: Run GDF tests
        run: |
          mkdir -p profraw
          export LD_LIBRARY_PATH=$GITHUB_WORKSPACE/install/lib:${ROCM_PATH}/lib
          export HIP_VISIBLE_DEVICES=0  # ROCR_VISIBLE_DEVICES already pins the assigned GPU; the runner also sets HIP_VISIBLE_DEVICES to the same host index, which stacks and yields hipErrorNoDevice on index-1 GPUs. After ROCR filtering the device is index 0 for HIP.
          export LLVM_PROFILE_FILE=$GITHUB_WORKSPACE/profraw/gdf_%p.profraw
          chmod +x install/bin/runvx
          # Run the GDF suite on both backends: --backend_type CPU exercises the
          # CPU HAF kernels, HIP exercises the HIP kernels. Both are compiled and
          # instrumented in the HIP build, so this covers both code paths.
          # runOpenVX.py sets runvx -affinity from --backend_type (CPU->CPU,
          # HIP->GPU), so no AGO_DEFAULT_TARGET override is needed here.
          python3 tests/amd_openvx_gdfs/runOpenVX.py \
            --runvx_directory $GITHUB_WORKSPACE/install/bin \
            --num_frames 10 \
            --backend_type CPU \
            --hidden no
          python3 tests/amd_openvx_gdfs/runOpenVX.py \
            --runvx_directory $GITHUB_WORKSPACE/install/bin \
            --num_frames 10 \
            --backend_type HIP \
            --hidden no
      - name: Upload profraw
        # Coverage data is best-effort: a transient GitHub artifact-service
        # upload timeout must not fail an otherwise-passing test job (the
        # coverage-summary step tolerates missing profraw via --failure-mode=all).
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: profraw-hip-gdf-tests
          path: profraw/
          if-no-files-found: ignore

  vision-tests-hip:
    name: Vision node tests (HIP)
    runs-on:
      group: linux-shark39-runner-group
    container:
      image: mivisionx/ubuntu-24.04:rocm-20260818
      options: --device /dev/kfd --device /dev/dri
    needs: build-hip-debug
    steps:
      - uses: actions/checkout@v4
      - name: Download debug build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-hip-debug
      - name: Unpack test bundle
        run: tar -xzf test-bundle-hip.tar.gz
      - name: Install python3
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends python3
      - name: Validate ROCm
        run: |
          rocminfo
          amd-smi || true
      - name: Run parametrized vision node tests
        run: |
          mkdir -p profraw
          export LD_LIBRARY_PATH=$GITHUB_WORKSPACE/install/lib:${ROCM_PATH}/lib
          export HIP_VISIBLE_DEVICES=0  # ROCR_VISIBLE_DEVICES already pins the assigned GPU; the runner also sets HIP_VISIBLE_DEVICES to the same host index, which stacks and yields hipErrorNoDevice on index-1 GPUs. After ROCR filtering the device is index 0 for HIP.
          export LLVM_PROFILE_FILE=$GITHUB_WORKSPACE/profraw/vision_%p.profraw
          chmod +x install/bin/runvx
          # Run the vision node sweeps on both targets. runVisionTests.py drives
          # runvx -affinity from --hardware_mode: CPU exercises the CPU HAF
          # kernels, GPU (--backend_type HIP) exercises the HIP kernels — both
          # compiled/instrumented in the HIP build.
          #   CPU pair: --hardware_mode CPU --backend_type CPU  (script defaults)
          #   GPU pair: --hardware_mode GPU --backend_type HIP
          run_vision () {
            # $1=hardware_mode $2=backend_type ; remaining args = size flags
            local hw="$1" be="$2"; shift 2
            echo "::group::vision nodes (hardware_mode=$hw backend_type=$be $*)"
            python3 tests/vision_tests/runVisionTests.py \
              --runvx_directory $GITHUB_WORKSPACE/install/bin \
              --hardware_mode "$hw" --backend_type "$be" --num_frames 10 "$@"
            echo "::endgroup::"
          }
          for pair in "CPU CPU" "GPU HIP"; do
            set -- $pair
            run_vision "$1" "$2"
            run_vision "$1" "$2" --width 5 --height 3
            run_vision "$1" "$2" --width 10 --height 10
          done
      - name: Upload profraw
        # Coverage data is best-effort: a transient GitHub artifact-service
        # upload timeout must not fail an otherwise-passing test job (the
        # coverage-summary step tolerates missing profraw via --failure-mode=all).
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: profraw-hip-vision-tests
          path: profraw/
          if-no-files-found: ignore

  # ===========================================================================
  # Benchmark Stage — GPU/HIP counterpart of the CPU workflow's `benchmark` job.
  # Compares AMD OpenVX (MIVisionX, HIP backend) vs OpenCV on the same GPU
  # runner, then cross-verifies both impls emit the same pixels so the speedup
  # numbers are honest apples-to-apples. Mirrors the CPU `benchmark` job; the
  # differences are all GPU-specific: amdclang toolchain, AGO_DEFAULT_TARGET=GPU,
  # 4K resolution, and the 40-kernel GPU parity set (the two Laplacian kernels
  # are excluded here for the SAME reason perf-gate-hip excludes them — a known
  # HIP synchronisation bug produces 200-300ms outliers; they stay covered by
  # the HIP CTS vision-pyramid job, just not by this timing comparison).
  # ===========================================================================

  benchmark-hip:
    name: Release OpenVX vs OpenCV benchmark (HIP)
    runs-on:
      group: linux-shark39-runner-group
    container:
      image: mivisionx/ubuntu-24.04:rocm-20260818
      options: --device /dev/kfd --device /dev/dri
    env:
      # 40 vision kernels with a stable 1:1 GPU implementation compared apples-
      # to-apples against OpenCV. Same set as perf-gate-hip: it is the CPU
      # benchmark's 42-kernel getVisionParityKernels()+LaplacianReconstruct set
      # MINUS LaplacianPyramid / LaplacianReconstruct, which have a known HIP
      # synchronisation bug causing 200-300ms outliers that would corrupt the
      # timing comparison. Keep in sync with perf-gate-hip's PARITY_KERNELS.
      PARITY_KERNELS: "And,Or,Xor,Not,AbsDiff,Add,Subtract,Multiply,Box3x3,Gaussian3x3,Median3x3,Erode3x3,Dilate3x3,Sobel3x3,CustomConvolution,NonLinearFilter,ColorConvert_RGB2IYUV,ChannelExtract,ChannelCombine,ConvertDepth,ScaleImage_Half,WarpAffine,WarpPerspective,Remap,Histogram,EqualizeHist,MeanStdDev,MinMaxLoc,IntegralImage,GaussianPyramid,HalfScaleGaussian,CannyEdgeDetector,HarrisCorners,FastCorners,OpticalFlowPyrLK,Magnitude,Phase,TableLookup,Threshold_Binary,WeightedAverage"
    needs:
      - build-hip
      - baseline-hip
      - graph-hip
      - data-objects-hip
      - image-ops-hip
      - vision-color-hip
      - vision-filters-hip
      - vision-arithmetic-hip
      - vision-geometric-hip
      - vision-features-hip
      - vision-statistics-hip
      - vision-pyramid-hip
      - api-tests-hip
      - gdf-tests-hip
    if: always() && needs.build-hip.result == 'success' && needs.baseline-hip.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Install benchmark dependencies
        run: |
          apt-get update -qq
          # python3-numpy is required by scripts/cross_verify_outputs.py;
          # libopencv-dev makes the parent CMake auto-include opencv-mark/.
          apt-get install -y --no-install-recommends build-essential cmake git \
            python3 python3-numpy libopencv-dev
          pkg-config --modversion opencv4 || true

      - name: Validate ROCm
        run: |
          rocminfo
          amd-smi || true

      - name: Download AMD OpenVX HIP Release artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-hip
          path: ${{ github.workspace }}/artifacts

      - name: Clone openvx-mark (vendor-agnostic benchmark suite + opencv-mark companion)
        run: |
          git clone --depth 1 https://github.com/kiritigowda/openvx-mark.git \
            $GITHUB_WORKSPACE/openvx-mark

      - name: Build openvx-mark + opencv-mark (single source tree, identical flags)
        run: |
          # Parent CMake auto-includes opencv-mark/ when libopencv-dev is found,
          # producing two binaries from one configure pass — guarantees both
          # link the same bench_core static lib (timer, stats, JSON schema) so
          # only the backing implementation differs. Built with amdclang so
          # openvx-mark links the HIP-backend libopenvx cleanly.
          mkdir -p $GITHUB_WORKSPACE/openvx-mark/build
          cd $GITHUB_WORKSPACE/openvx-mark/build
          cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="${ROCM_PATH}/bin/amdclang" \
            -DCMAKE_CXX_COMPILER="${ROCM_PATH}/bin/amdclang++" \
            -DOPENVX_INCLUDES=$GITHUB_WORKSPACE/amd_openvx/openvx/include \
            -DOPENVX_LIB_DIR=$GITHUB_WORKSPACE/artifacts/build/lib \
            ..
          cmake --build . -j$(nproc)
          test -x ./openvx-mark \
            || { echo "ERROR: openvx-mark not built"; exit 1; }
          test -x ./opencv-mark/opencv-mark \
            || { echo "ERROR: opencv-mark not built — libopencv-dev likely not detected by CMake"; exit 1; }
          ./openvx-mark --help | head -3 || true
          ./opencv-mark/opencv-mark --help | head -3 || true

      - name: Timer self-test (both binaries)
        run: |
          cd $GITHUB_WORKSPACE/openvx-mark/build
          export LD_LIBRARY_PATH=$GITHUB_WORKSPACE/artifacts/build/lib:${ROCM_PATH}/lib
          export HIP_VISIBLE_DEVICES=0  # ROCR_VISIBLE_DEVICES already pins the assigned GPU; the runner also sets HIP_VISIBLE_DEVICES to the same host index, which stacks and yields hipErrorNoDevice on index-1 GPUs. After ROCR filtering the device is index 0 for HIP.
          # Catches a sloppy runner clock before we trust a single timing number.
          ./openvx-mark --validate-timing
          ./opencv-mark/opencv-mark --validate-timing

      - name: Bench MIVisionX (40 vision kernels, 4K × 20, GPU)
        run: |
          cd $GITHUB_WORKSPACE/openvx-mark/build
          export LD_LIBRARY_PATH=$GITHUB_WORKSPACE/artifacts/build/lib:${ROCM_PATH}/lib
          export HIP_VISIBLE_DEVICES=0  # ROCR_VISIBLE_DEVICES already pins the assigned GPU; the runner also sets HIP_VISIBLE_DEVICES to the same host index, which stacks and yields hipErrorNoDevice on index-1 GPUs. After ROCR filtering the device is index 0 for HIP.
          export AGO_DEFAULT_TARGET=GPU
          # Explicit `--kernel "$PARITY_KERNELS"` runs exactly the 40 GPU-parity
          # kernels with a 1:1 OpenCV equivalent. `--skip-pipelines` matches the
          # parity semantics (graph mode is the default). 4K is the GPU-scale
          # resolution (matches perf-gate-hip); warmup uses the same kernel set
          # so the `--warmup 5` JIT/cache warmup matters.
          ./openvx-mark --resolution 4K --iterations 5 --warmup 0 --threads 1 \
            --kernel "$PARITY_KERNELS" --skip-pipelines \
            --output-dir /tmp/warmup-mivisionx-throwaway \
            >/dev/null 2>&1 || true
          ./openvx-mark --kernel "$PARITY_KERNELS" --skip-pipelines \
            --resolution 4K --iterations 20 --warmup 5 --threads 1 \
            --output-dir results-mivisionx
          # Sentinel-kernel dump for downstream cross_verify_outputs.py.
          # Runs the kernel set ONCE (no timing, no warmup) so it's cheap.
          ./openvx-mark --dump-outputs dump-mivisionx --seed 42

      - name: Bench OpenCV (40 vision kernels, 4K × 20)
        run: |
          cd $GITHUB_WORKSPACE/openvx-mark/build
          # Same explicit 40-kernel set as the MIVisionX side so the two reports
          # join 1:1 in the pairwise comparison below. OpenCV runs on CPU; this
          # is the honest "AMD OpenVX GPU vs OpenCV" comparison the CPU workflow
          # does on the CPU backend. `--threads 1` pins OpenCV to one thread.
          ./opencv-mark/opencv-mark --resolution 4K --iterations 5 --warmup 0 --threads 1 \
            --kernel "$PARITY_KERNELS" --skip-pipelines \
            --output-dir /tmp/warmup-opencv-throwaway \
            >/dev/null 2>&1 || true
          ./opencv-mark/opencv-mark --kernel "$PARITY_KERNELS" --skip-pipelines \
            --resolution 4K --iterations 20 --warmup 5 --threads 1 \
            --output-dir results-opencv
          ./opencv-mark/opencv-mark --dump-outputs dump-opencv --seed 42

      - name: Summarize speedup (AMD OpenVX HIP vs OpenCV, 40 vision kernels)
        if: always()
        run: |
          set -euo pipefail
          cd $GITHUB_WORKSPACE/openvx-mark
          OPENVX=build/results-mivisionx/benchmark_results.json
          OPENCV=build/results-opencv/benchmark_results.json
          if [ ! -f "$OPENVX" ] || [ ! -f "$OPENCV" ]; then
            {
              echo "# AMD OpenVX vs OpenCV — vision kernel speedup (HIP / GPU backend)"
              echo ""
              echo "_Missing benchmark results — cannot render the speedup summary._"
              echo "- AMD OpenVX results: $([ -f "$OPENVX" ] && echo found || echo missing)"
              echo "- OpenCV results: $([ -f "$OPENCV" ] && echo found || echo missing)"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          mkdir -p comparisons
          # Rich per-kernel detail report (md + csv) — kept for the uploaded
          # `benchmark-comparison-hip` artifact. speedup = throughput(arg2)/throughput(arg1),
          # so OpenCV first + MIVisionX second reads as "MIVisionX over OpenCV".
          python3 scripts/compare_reports.py "$OPENCV" "$OPENVX" \
            --output comparisons/mivisionx-over-opencv

          # Intuitive, plain-English step summary leading with the bottom line.
          python3 $GITHUB_WORKSPACE/.github/scripts/benchmark_summary.py \
            "$OPENVX" "$OPENCV" \
            --candidate-label "AMD OpenVX (MIVisionX, HIP)" \
            --baseline-label "OpenCV" \
            --expected-kernels 40 \
            --summary-out "$GITHUB_STEP_SUMMARY"

      - name: Cross-impl numerical verification (OpenCV ↔ MIVisionX)
        if: always()
        run: |
          set -euo pipefail
          cd $GITHUB_WORKSPACE/openvx-mark
          OPENCV_DUMP=build/dump-opencv
          VX_DUMP=build/dump-mivisionx
          mkdir -p comparisons
          # Rendered as a collapsed appendix below the speedup headline: it's
          # the proof the speedups are honest (same pixels out of both impls),
          # not the headline a reviewer reads first.
          {
            echo ""
            echo "---"
            echo ""
            echo "<details><summary><b>Numerical verification</b> (OpenCV ↔ MIVisionX HIP) — proof the speedups are honest</summary>"
            echo ""
            echo "Sentinel kernel suite (no timing, no warmup) dumped by"
            echo "\`--dump-outputs\` on each binary; \`scripts/cross_verify_outputs.py\`"
            echo "loads both dumps and computes max-abs-diff + PSNR + exact-%"
            echo "per kernel against per-kernel tolerance rules. Proves the"
            echo "speedup table above is honest apples-to-apples and not"
            echo "\"OpenCV is faster because it's silently computing the"
            echo "wrong thing\"."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          if [ ! -d "$OPENCV_DUMP" ] || [ ! -d "$VX_DUMP" ]; then
            {
              echo "_Skipped — dump directory missing ($VX_DUMP or $OPENCV_DUMP)._"
              echo ""
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          set +e
          python3 scripts/cross_verify_outputs.py \
            "$OPENCV_DUMP" "$VX_DUMP" \
            --left-label "OpenCV" --right-label "MIVisionX" \
            --json comparisons/cross-verify-mivisionx.json \
            >> "$GITHUB_STEP_SUMMARY"
          rc=$?
          set -e
          {
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ]; then
            echo "::warning::Cross-impl verification flagged ≥1 divergence — see job summary"
          fi

      - name: Upload per-impl benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-hip
          path: |
            ${{ github.workspace }}/openvx-mark/build/results-mivisionx/
            ${{ github.workspace }}/openvx-mark/build/results-opencv/
          if-no-files-found: ignore
          retention-days: 90

      - name: Upload pairwise comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-comparison-hip
          path: ${{ github.workspace }}/openvx-mark/comparisons/
          if-no-files-found: ignore
          retention-days: 90

      # Sentinel kernel dumps — uploaded so a reviewer can re-run
      # scripts/cross_verify_outputs.py locally against either pair
      # without rebuilding any binary, and so the raw .bin files are
      # inspectable after the fact for any divergence the verifier flagged.
      - name: Upload sentinel output dumps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-verify-dumps-hip
          path: |
            ${{ github.workspace }}/openvx-mark/build/dump-mivisionx/
            ${{ github.workspace }}/openvx-mark/build/dump-opencv/
          if-no-files-found: ignore
          retention-days: 90

  # ===========================================================================
  # Coverage Stage — merge profraw from gfx1030 test jobs and generate report.
  # Runs on gfx1100 since it just processes artifacts (no GPU execution).
  # Uses ROCm's bundled llvm-profdata / llvm-cov to match the amdclang
  # toolchain version that emitted the instrumentation.
  # ===========================================================================

  coverage-summary-hip:
    name: Code coverage summary (HIP)
    runs-on:
      group: linux-shark39-runner-group
    container:
      image: mivisionx/ubuntu-24.04:rocm-20260818
      options: --device /dev/kfd --device /dev/dri
    if: always() && needs.build-hip-debug.result == 'success'
    needs:
      - build-hip-debug
      - baseline-hip
      - graph-hip
      - data-objects-hip
      - image-ops-hip
      - vision-color-hip
      - vision-filters-hip
      - vision-arithmetic-hip
      - vision-geometric-hip
      - vision-features-hip
      - vision-statistics-hip
      - vision-pyramid-hip
      - pipelining-hip
      - streaming-hip
      - api-tests-hip
      - gdf-tests-hip
      - vision-tests-hip
    steps:
      - uses: actions/checkout@v4

      - name: Install coverage tools
        run: |
          # python3 is required (summary script). lcov/genhtml are only used for
          # the optional HTML report; if the image can't provide them, don't
          # fail the job — the llvm-cov text/json/lcov outputs still produce the
          # coverage numbers and the genhtml step is guarded below.
          apt-get update -qq
          apt-get install -y --no-install-recommends python3
          apt-get install -y --no-install-recommends lcov \
            || echo "::warning::lcov not available — HTML coverage report will be skipped"

      - name: Validate ROCm
        run: |
          rocminfo
          amd-smi || true

      - name: Download debug build (for libopenvx.so)
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-hip-debug

      - name: Unpack test bundle
        run: tar -xzf test-bundle-hip.tar.gz

      - name: Download all HIP profraw artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: profraw-hip-*
          path: all-profraw
          merge-multiple: true

      - name: Merge profraw files
        run: |
          # Collect paths into a file FIRST. Steps run under bash -eo pipefail,
          # so `find ... | head -50` makes find die with SIGPIPE (exit 141)
          # when there are >50 files and head closes the pipe early — that
          # propagates through pipefail and fails the step. Read display/count
          # from the file instead so nothing closes find's pipe.
          find all-profraw -name '*.profraw' -type f > profraw_list.txt
          PROFRAW_COUNT=$(wc -l < profraw_list.txt)
          echo "Profraw files found (first 50):"
          head -50 profraw_list.txt
          echo "Total profraw files: ${PROFRAW_COUNT}"
          if [ "$PROFRAW_COUNT" -eq 0 ]; then
            echo "::error::No profraw files found — no coverage data collected"
            echo "## Code Coverage (HIP)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "No profraw files were collected from test jobs." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # Find llvm-profdata. The .profraw indexed-profile format is versioned
          # by the LLVM that instrumented libopenvx.so (amdclang's LLVM), so we
          # use the tool bundled with this ROCm/amdclang install. If this image
          # doesn't ship it, code coverage simply isn't available with this ROCm
          # version — report that and pass the stage (don't fail CI).
          AMDCLANG="$(command -v amdclang 2>/dev/null || true)"
          [ -z "${AMDCLANG}" ] && [ -x "${ROCM_PATH}/bin/amdclang" ] && AMDCLANG="${ROCM_PATH}/bin/amdclang"
          [ -n "${AMDCLANG}" ] && AMDCLANG_BIN="$(dirname "$(readlink -f "${AMDCLANG}")")"
          PROFDATA_BIN=""
          for cand in llvm-profdata \
                      "${AMDCLANG_BIN:-/nonexistent}/llvm-profdata" \
                      /opt/rocm/core-*/lib/llvm/bin/llvm-profdata \
                      "${ROCM_PATH}/lib/llvm/bin/llvm-profdata" \
                      "${ROCM_PATH}/llvm/bin/llvm-profdata" \
                      "${ROCM_PATH}/bin/llvm-profdata"; do
            if command -v "${cand}" >/dev/null 2>&1; then
              PROFDATA_BIN="$(command -v "${cand}")"; break
            fi
          done
          if [ -z "${PROFDATA_BIN}" ]; then
            echo "::warning::llvm-profdata not available in this ROCm image — skipping code coverage."
            {
              echo "## AMD OpenVX Code Coverage (HIP)"
              echo ""
              echo "_Code coverage is unavailable with this version of ROCm "
              echo "(\`llvm-profdata\` is not shipped in the image). Tests ran "
              echo "successfully; only the coverage report was skipped._"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "COVERAGE_AVAILABLE=false" >> "$GITHUB_ENV"
            exit 0
          fi
          LLVM_BIN="$(dirname "${PROFDATA_BIN}")"
          echo "Using LLVM tools from: ${LLVM_BIN}"
          echo "LLVM_BIN=${LLVM_BIN}" >> "$GITHUB_ENV"
          echo "COVERAGE_AVAILABLE=true" >> "$GITHUB_ENV"
          # --failure-mode=all skips corrupt files instead of aborting.
          "${PROFDATA_BIN}" merge \
            -sparse \
            --failure-mode=all \
            -f profraw_list.txt \
            -o coverage.profdata

      - name: Generate coverage report
        if: env.COVERAGE_AVAILABLE == 'true'
        run: |
          # LLVM_BIN was resolved and exported by the merge step. Pick llvm-cov
          # from the same dir; fall back to a version-suffixed name if needed so
          # the cov tool matches the profdata that produced coverage.profdata.
          LLVM_COV="${LLVM_BIN}/llvm-cov"
          if [ ! -x "${LLVM_COV}" ]; then
            LLVM_COV="$(ls "${LLVM_BIN}"/llvm-cov* 2>/dev/null | head -1 || true)"
          fi
          if [ -z "${LLVM_COV}" ] || [ ! -x "${LLVM_COV}" ]; then
            echo "::error::llvm-cov not found in ${LLVM_BIN}"
            exit 1
          fi
          LIBDIR="$GITHUB_WORKSPACE/install/lib"
          PROFDATA="$GITHUB_WORKSPACE/coverage.profdata"

          # Report against every instrumented shared library that was built.
          # libopenvx.so is the primary (positional) object; libvxu.so and
          # libvx_rpp.so are added with -object when present so their coverage
          # is included too.
          COV_OBJECTS=("$LIBDIR/libopenvx.so")
          for lib in libvxu.so libvx_rpp.so; do
            if [ -f "$LIBDIR/$lib" ]; then
              COV_OBJECTS+=(-object "$LIBDIR/$lib")
            fi
          done
          echo "Coverage objects: ${COV_OBJECTS[*]}"

          "${LLVM_COV}" report "${COV_OBJECTS[@]}" \
            -instr-profile="${PROFDATA}" \
            -ignore-filename-regex='(test|conformance)' \
            | tee coverage_report.txt

          "${LLVM_COV}" export "${COV_OBJECTS[@]}" \
            -instr-profile="${PROFDATA}" \
            -format=text \
            -ignore-filename-regex='(test|conformance)' \
            > coverage.json

          "${LLVM_COV}" export "${COV_OBJECTS[@]}" \
            -instr-profile="${PROFDATA}" \
            -format=lcov \
            -ignore-filename-regex='(test|conformance)' \
            > coverage.lcov

          # genhtml (from lcov) is optional — skip the HTML report if it isn't
          # installed. The coverage numbers come from llvm-cov above regardless.
          if command -v genhtml >/dev/null 2>&1; then
            GENHTML_EXTRA_ARGS=()
            if genhtml --version 2>&1 | grep -qE 'LCOV version ([2-9]|[1-9][0-9])'; then
              GENHTML_EXTRA_ARGS+=(--ignore-errors unmapped)
            fi
            genhtml coverage.lcov \
              --output-directory coverage_html \
              --branch-coverage \
              --title "AMD OpenVX Code Coverage (HIP)" \
              --ignore-errors source \
              "${GENHTML_EXTRA_ARGS[@]}" \
              2>&1 || echo "::warning::genhtml had errors"
          else
            echo "::warning::genhtml not installed — skipping HTML coverage report"
          fi

      - name: Post coverage summary
        if: always() && env.COVERAGE_AVAILABLE == 'true'
        run: |
          python3 - "$GITHUB_STEP_SUMMARY" <<'PYEOF'
          import json, sys, os

          summary_file = sys.argv[1]

          json_path = "coverage.json"
          text_path = "coverage_report.txt"

          if not os.path.exists(json_path) and not os.path.exists(text_path):
              with open(summary_file, "a") as f:
                  f.write("## AMD OpenVX Code Coverage (HIP)\n\n")
                  f.write("Coverage report generation failed.\n")
              sys.exit(0)

          if os.path.exists(json_path):
              with open(json_path) as f:
                  data = json.load(f)

              totals = data.get("data", [{}])[0].get("totals", {})
              files = data.get("data", [{}])[0].get("files", [])

              lines = totals.get("lines", {})
              funcs = totals.get("functions", {})
              branches = totals.get("branches", {})
              regions = totals.get("regions", {})

              line_pct = lines.get("percent", 0)
              func_pct = funcs.get("percent", 0)
              branch_pct = branches.get("percent", 0)
              region_pct = regions.get("percent", 0)

              line_covered = lines.get("covered", 0)
              line_total = lines.get("count", 0)
              func_covered = funcs.get("covered", 0)
              func_total = funcs.get("count", 0)
              branch_covered = branches.get("covered", 0)
              branch_total = branches.get("count", 0)

              out = []

              out.append("## AMD OpenVX Code Coverage Report (HIP)")
              out.append("")
              out.append("### Overall Summary")
              out.append("")
              out.append("| Metric | Covered | Total | Coverage |")
              out.append("|:-------|--------:|------:|---------:|")
              out.append(f"| Lines | {line_covered:,} | {line_total:,} | **{line_pct:.2f}%** |")
              out.append(f"| Functions | {func_covered:,} | {func_total:,} | **{func_pct:.2f}%** |")
              out.append(f"| Branches | {branch_covered:,} | {branch_total:,} | **{branch_pct:.2f}%** |")
              out.append(f"| Regions | {regions.get('covered', 0):,} | {regions.get('count', 0):,} | **{region_pct:.2f}%** |")
              out.append("")

              file_data = []
              for fobj in files:
                  fname = fobj.get("filename", "")
                  for prefix in ["/__w/MIVisionX/MIVisionX/amd_openvx/openvx/",
                                 "/home/runner/work/MIVisionX/MIVisionX/amd_openvx/openvx/",
                                 "amd_openvx/openvx/"]:
                      if fname.startswith(prefix):
                          fname = fname[len(prefix):]
                          break

                  fl = fobj.get("summary", {}).get("lines", {})
                  ff = fobj.get("summary", {}).get("functions", {})
                  fb = fobj.get("summary", {}).get("branches", {})

                  if fl.get("count", 0) == 0 and ff.get("count", 0) == 0:
                      continue

                  file_data.append({
                      "name": fname,
                      "lines_covered": fl.get("covered", 0),
                      "lines_total": fl.get("count", 0),
                      "lines_pct": fl.get("percent", 0),
                      "funcs_covered": ff.get("covered", 0),
                      "funcs_total": ff.get("count", 0),
                      "funcs_pct": ff.get("percent", 0),
                      "branches_covered": fb.get("covered", 0),
                      "branches_total": fb.get("count", 0),
                      "branches_pct": fb.get("percent", 0),
                  })

              file_data.sort(key=lambda x: x["name"])

              groups = {}
              for fd in file_data:
                  parts = fd["name"].split("/")
                  group = parts[0] + "/" if len(parts) > 1 else ""
                  groups.setdefault(group, []).append(fd)

              out.append("### File Coverage Details")
              out.append("")
              out.append("| File | Lines | Line % | Functions | Func % | Branches | Branch % |")
              out.append("|:-----|------:|-------:|----------:|-------:|---------:|---------:|")

              for group_name in sorted(groups.keys()):
                  group_files = groups[group_name]
                  if group_name:
                      g_lc = sum(f["lines_covered"] for f in group_files)
                      g_lt = sum(f["lines_total"] for f in group_files)
                      g_fc = sum(f["funcs_covered"] for f in group_files)
                      g_ft = sum(f["funcs_total"] for f in group_files)
                      g_bc = sum(f["branches_covered"] for f in group_files)
                      g_bt = sum(f["branches_total"] for f in group_files)
                      g_lp = (g_lc / g_lt * 100) if g_lt > 0 else 0
                      g_fp = (g_fc / g_ft * 100) if g_ft > 0 else 0
                      g_bp = (g_bc / g_bt * 100) if g_bt > 0 else 0
                      out.append(f"| **{group_name}** | **{g_lc}/{g_lt}** | **{g_lp:.1f}%** | **{g_fc}/{g_ft}** | **{g_fp:.1f}%** | **{g_bc}/{g_bt}** | **{g_bp:.1f}%** |")

                  for fd in group_files:
                      name = fd["name"]
                      lc, lt, lp = fd["lines_covered"], fd["lines_total"], fd["lines_pct"]
                      fc, ft, fp = fd["funcs_covered"], fd["funcs_total"], fd["funcs_pct"]
                      bc, bt, bp = fd["branches_covered"], fd["branches_total"], fd["branches_pct"]
                      out.append(f"| {name} | {lc}/{lt} | {lp:.1f}% | {fc}/{ft} | {fp:.1f}% | {bc}/{bt} | {bp:.1f}% |")

              out.append("")

              with open(summary_file, "a") as f:
                  f.write("\n".join(out) + "\n")
          else:
              with open(text_path) as f:
                  report_text = f.read()
              with open(summary_file, "a") as f:
                  f.write("## AMD OpenVX Code Coverage Report (HIP)\n\n")
                  f.write("```\n")
                  f.write(report_text)
                  f.write("```\n")
          PYEOF

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report-hip
          path: |
            coverage.profdata
            coverage_report.txt
            coverage.json
            coverage.lcov
            coverage_html/
          retention-days: 30
          if-no-files-found: ignore
