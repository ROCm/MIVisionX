name: AMD OpenVX Benchmark

on:
  workflow_run:
    workflows: ["AMD OpenVX Conformance Tests"]
    types: [completed]

jobs:
  benchmark:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git python3

      - name: Download build artifacts from conformance run
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: ${{ github.workspace }}/artifacts
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Clone openvx-mark
        run: |
          git clone --depth 1 https://github.com/kiritigowda/openvx-mark.git \
            ${{ github.workspace }}/openvx-mark

      - name: Build openvx-mark
        run: |
          mkdir -p ${{ github.workspace }}/openvx-mark/build
          cd ${{ github.workspace }}/openvx-mark/build
          cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DOPENVX_INCLUDES=${{ github.workspace }}/amd_openvx/openvx/include \
            -DOPENVX_LIB_DIR=${{ github.workspace }}/artifacts/build/lib \
            ..
          cmake --build . -j$(nproc)

      - name: Run benchmark (warmup + measurement)
        run: |
          cd ${{ github.workspace }}/openvx-mark/build
          export LD_LIBRARY_PATH=${{ github.workspace }}/artifacts/build/lib
          # Warmup: prime caches
          ./openvx-mark --resolution FHD --iterations 5 --warmup 0 \
            --output /tmp/warmup-throwaway >/dev/null 2>&1 || true
          # Real measurement
          ./openvx-mark --resolution FHD --iterations 20 --warmup 5

      - name: Post benchmark summary
        if: always()
        run: |
          RESULTS=${{ github.workspace }}/openvx-mark/build/benchmark_results/benchmark_results.json
          if [ ! -f "$RESULTS" ]; then
            echo "_No benchmark results found._" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 - "$RESULTS" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          with open(sys.argv[1]) as f:
              report = json.load(f)
          results = report.get("results", [])
          if not results:
              print("_No benchmark results._")
              sys.exit(0)
          print("## AMD OpenVX Benchmark Summary")
          print()
          si = report.get("system", {})
          if si:
              print(f'**Runner:** {si.get("cpu_model", "N/A")} '
                    f'({si.get("cpu_cores", "?")} cores, '
                    f'{si.get("ram_gb", "?")} GB RAM)')
              print()
          print("| Kernel | Mode | Res | MP/s | Median (ms) | CV% | Verified |")
          print("|:---|---|---|---:|---:|---:|:---:|")
          for r in sorted(results, key=lambda x: x.get("name", "")):
              wc = r.get("wall_clock", {}) or {}
              v = "PASS" if r.get("verified", False) else "FAIL"
              print(f'| `{r.get("name","")}` '
                    f'| {r.get("mode","")} '
                    f'| {r.get("resolution","")} '
                    f'| {r.get("megapixels_per_sec", 0):.2f} '
                    f'| {wc.get("median_ms", 0):.3f} '
                    f'| {wc.get("cv_percent", 0):.2f} '
                    f'| {v} |')
          print()
          scores = report.get("scores", {})
          if scores:
              print("### Composite Scores")
              print()
              overall = scores.get("overall_vision_score")
              if overall is not None:
                  print(f'**Overall Vision Score:** {overall:.2f}')
                  print()
              categories = scores.get("categories", {})
              if categories:
                  print("| Category | Score |")
                  print("|:---|---:|")
                  for cat, score in sorted(categories.items()):
                      print(f'| {cat} | {score:.2f} |')
                  print()
          PY

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: ${{ github.workspace }}/openvx-mark/build/benchmark_results/
          if-no-files-found: ignore
          retention-days: 90
