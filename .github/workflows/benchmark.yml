name: AMD OpenVX Benchmark

on:
  workflow_run:
    workflows: ["AMD OpenVX CI"]
    types: [completed]

jobs:
  benchmark:
    name: Release OpenVX vs OpenCV benchmark
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git python3 libopencv-dev

      - name: Download AMD OpenVX Release artifacts from CI
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: ${{ github.workspace }}/artifacts
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Clone openvx-mark
        run: |
          git clone --depth 1 https://github.com/kiritigowda/openvx-mark.git \
            ${{ github.workspace }}/openvx-mark

      - name: Build openvx-mark
        run: |
          mkdir -p ${{ github.workspace }}/openvx-mark/build
          cd ${{ github.workspace }}/openvx-mark/build
          cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DOPENVX_INCLUDES=${{ github.workspace }}/amd_openvx/openvx/include \
            -DOPENVX_LIB_DIR=${{ github.workspace }}/artifacts/build/lib \
            ..
          cmake --build . -j$(nproc)

      - name: Run AMD OpenVX benchmark on this runner
        run: |
          cd ${{ github.workspace }}/openvx-mark/build
          export LD_LIBRARY_PATH=${{ github.workspace }}/artifacts/build/lib
          # Warmup: prime caches
          ./openvx-mark --resolution FHD --iterations 5 --warmup 0 \
            --output /tmp/warmup-throwaway >/dev/null 2>&1 || true
          # Real measurement
          ./openvx-mark --resolution FHD --iterations 20 --warmup 5

      - name: Post benchmark summary
        if: always()
        run: |
          RESULTS=${{ github.workspace }}/openvx-mark/build/benchmark_results/benchmark_results.json
          if [ ! -f "$RESULTS" ]; then
            echo "_No benchmark results found._" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 - "$RESULTS" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          with open(sys.argv[1]) as f:
              report = json.load(f)
          results = report.get("results", [])
          if not results:
              print("_No benchmark results._")
              sys.exit(0)
          print("## AMD OpenVX Benchmark Summary")
          print()
          si = report.get("system", {})
          if si:
              print(f'**Runner:** {si.get("cpu_model", "N/A")} '
                    f'({si.get("cpu_cores", "?")} cores, '
                    f'{si.get("ram_gb", "?")} GB RAM)')
              print()
          print("| Kernel | Mode | Res | MP/s | Median (ms) | CV% | Verified |")
          print("|:---|---|---|---:|---:|---:|:---:|")
          for r in sorted(results, key=lambda x: x.get("name", "")):
              wc = r.get("wall_clock", {}) or {}
              v = "PASS" if r.get("verified", False) else "FAIL"
              print(f'| `{r.get("name","")}` '
                    f'| {r.get("mode","")} '
                    f'| {r.get("resolution","")} '
                    f'| {r.get("megapixels_per_sec", 0):.2f} '
                    f'| {wc.get("median_ms", 0):.3f} '
                    f'| {wc.get("cv_percent", 0):.2f} '
                    f'| {v} |')
          print()
          scores = report.get("scores", {})
          if scores:
              print("### Composite Scores")
              print()
              overall = scores.get("overall_vision_score")
              if overall is not None:
                  print(f'**Overall Vision Score:** {overall:.2f}')
                  print()
              categories = scores.get("categories", {})
              if categories:
                  print("| Category | Score |")
                  print("|:---|---:|")
                  for cat, score in sorted(categories.items()):
                      print(f'| {cat} | {score:.2f} |')
                  print()
          PY

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: ${{ github.workspace }}/openvx-mark/build/benchmark_results/
          if-no-files-found: ignore
          retention-days: 90

      - name: Build opencv-mark
        run: |
          mkdir -p ${{ github.workspace }}/tests/opencv_benchmark/build
          cd ${{ github.workspace }}/tests/opencv_benchmark/build
          cmake -DCMAKE_BUILD_TYPE=Release ..
          cmake --build . -j$(nproc)

      - name: Run OpenCV benchmark on this runner
        run: |
          cd ${{ github.workspace }}/tests/opencv_benchmark/build
          # Warmup: prime caches
          ./opencv-mark --resolution FHD --iterations 5 --warmup 0 \
            --output-dir /tmp/warmup-opencv-throwaway >/dev/null 2>&1 || true
          # Real measurement
          ./opencv-mark --resolution FHD --iterations 20 --warmup 5

      - name: Compare same-runner OpenVX vs OpenCV benchmarks
        if: always()
        run: |
          OPENVX=${{ github.workspace }}/openvx-mark/build/benchmark_results/benchmark_results.json
          OPENCV=${{ github.workspace }}/tests/opencv_benchmark/build/benchmark_results/benchmark_results.json
          if [ ! -f "$OPENVX" ] || [ ! -f "$OPENCV" ]; then
            echo "_Missing benchmark results for comparison._" >> "$GITHUB_STEP_SUMMARY"
            echo "OpenVX results: $([ -f "$OPENVX" ] && echo 'found' || echo 'missing')"
            echo "OpenCV results: $([ -f "$OPENCV" ] && echo 'found' || echo 'missing')"
            exit 0
          fi
          python3 - "$OPENVX" "$OPENCV" "${{ github.workspace }}/comparison" <<'PY'
          import csv
          import json
          import sys

          openvx_path, opencv_path, output_prefix = sys.argv[1:4]

          def load_results(path):
              with open(path) as f:
                  report = json.load(f)
              results = {}
              for item in report.get("results", []):
                  name = item.get("name")
                  resolution = item.get("resolution")
                  wall_clock = item.get("wall_clock", {}) or {}
                  median_ms = wall_clock.get("median_ms")
                  mps = item.get("megapixels_per_sec")
                  if name and resolution and median_ms and median_ms > 0:
                      results[(name, resolution)] = {
                          "name": name,
                          "category": item.get("category", ""),
                          "resolution": resolution,
                          "median_ms": float(median_ms),
                          "mps": float(mps or 0),
                          "verified": bool(item.get("verified", False)),
                      }
              return results

          openvx = load_results(openvx_path)
          opencv = load_results(opencv_path)
          rows = []
          for key in sorted(openvx.keys() & opencv.keys()):
              vx = openvx[key]
              cv = opencv[key]
              speedup = cv["median_ms"] / vx["median_ms"]
              rows.append({
                  "name": vx["name"],
                  "category": vx["category"],
                  "resolution": vx["resolution"],
                  "openvx_median_ms": vx["median_ms"],
                  "opencv_median_ms": cv["median_ms"],
                  "openvx_mps": vx["mps"],
                  "opencv_mps": cv["mps"],
                  "speedup": speedup,
                  "openvx_verified": vx["verified"],
                  "opencv_verified": cv["verified"],
              })

          md_path = output_prefix + ".md"
          csv_path = output_prefix + ".csv"

          with open(csv_path, "w", newline="") as f:
              writer = csv.DictWriter(f, fieldnames=[
                  "name", "category", "resolution",
                  "openvx_median_ms", "opencv_median_ms",
                  "openvx_mps", "opencv_mps", "speedup",
                  "openvx_verified", "opencv_verified",
              ])
              writer.writeheader()
              writer.writerows(rows)

          with open(md_path, "w") as f:
              f.write("## OpenVX vs OpenCV Benchmark Comparison\n\n")
              f.write("Both benchmark suites are measured in this job on the same GitHub runner. ")
              f.write("The OpenVX benchmark links against the Release MIVisionX build.\n\n")
              if not rows:
                  f.write("_No matching benchmark results found._\n")
              else:
                  avg = sum(row["speedup"] for row in rows) / len(rows)
                  wins = sum(1 for row in rows if row["speedup"] > 1.0)
                  f.write(f"**Average OpenVX speedup:** {avg:.2f}x across {len(rows)} matched kernels.  \n")
                  f.write(f"**OpenVX faster:** {wins}/{len(rows)} kernels.\n\n")
                  f.write("| Kernel | Category | Res | OpenVX Median (ms) | OpenCV Median (ms) | Speedup | OpenVX MP/s | OpenCV MP/s |\n")
                  f.write("|:---|:---|:---|---:|---:|---:|---:|---:|\n")
                  for row in rows:
                      f.write(
                          f"| `{row['name']}` | {row['category']} | {row['resolution']} "
                          f"| {row['openvx_median_ms']:.3f} "
                          f"| {row['opencv_median_ms']:.3f} "
                          f"| {row['speedup']:.2f}x "
                          f"| {row['openvx_mps']:.2f} "
                          f"| {row['opencv_mps']:.2f} |\n"
                      )
          PY
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "---" >> "$GITHUB_STEP_SUMMARY"
          cat ${{ github.workspace }}/comparison.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload comparison artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-comparison
          path: |
            ${{ github.workspace }}/comparison.md
            ${{ github.workspace }}/comparison.csv
            ${{ github.workspace }}/tests/opencv_benchmark/build/benchmark_results/
          if-no-files-found: ignore
          retention-days: 90
