# Known MIVisionX findings: the only place a failing result becomes "known".
#
# The entries of the vision-pack QA known-issue baseline that cover the
# mivisionx suite and this repository's robustness checks, without the globs
# of other suites. IDs are unchanged: C, H and M come from the functional test
# report of 25 Sep 2026 (critical, high, medium), N were found while porting
# the suites (27 Sep 2026), and L-* are low items. issue: links the upstream
# issue each finding was filed as; ROCm/MIVisionX#1767 lists the MIVisionX ones.
#
# Each entry:
#   id, title, severity (critical|high|medium|low), owner
#   kind:   xfail (expected to fail; a pass is reported as "fixed"),
#           flaky, skip (expected to be blocked/skipped), quarantine (ignored)
#   match:  shell-style globs over result IDs <suite>::<group>::<name>. Match
#           only the failing tests: a glob that also covers passing tests turns
#           them into "fixed" on every run. "[" must be written "[[]".
#   match_file: a list under lists/ (relative to this file), one result ID or
#           glob per line, for findings that cover many parameterised results
#   gfx:    optional globs over the tested GPU (default: every GPU, and runs
#           without one); [none] scopes an entry to runs on a runner without
#           a usable GPU, when only the needs_gpu: false suites run
#   tiers:  optional; issue: upstream URL; added / review_by: YYYY-MM-DD
#   strict: report the entry in the verdict reasons once all its tests pass
# By review_by, re-verify each entry: extend review_by while the upstream issue
# is open, or remove the entry once the fix has shipped.
schema: 1
issues:
  # ------------------------------------------------------------------ critical
  - id: C1
    title: GPU 1-bit threshold kernel writes wrong bits, so threshold -> AND/OR/XOR graphs are wrong on GPU
    severity: critical
    owner: MIVisionX
    kind: xfail
    match:
      - "mivisionx::parity.*.GPU::U1_Threshold_And"
      - "mivisionx::parity.*.GPU::U1_Threshold_And3"
      - "mivisionx::parity.*.GPU::U1_Threshold_Or"
      - "mivisionx::parity.*.GPU::U1_Threshold_Xor"
      - "mivisionx::samples.GPU::skintone"
    issue: https://github.com/ROCm/MIVisionX/issues/1768
    added: 2026-09-25
    review_by: 2026-12-31
    strict: true

