name: AMD OpenVX CI (HIP)

on:
  push:
    branches: [master, main, develop]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches: [master, main, develop]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

defaults:
  run:
    shell: bash

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ROCM_PATH: /opt/rocm

# ---------------------------------------------------------------------------
# Runner & container assignment
#
#   gfx1100  linux-shark39-gfx1100-gpu-rocm  (prolense-shark39-gfx1100-scaleset)
#            → Build (release + debug) + Performance (perf-gate) + Coverage summary
#
#   gfx1030  linux-shark39-gfx1030-gpu-rocm  (prolense-shark39-gfx1030-scaleset)
#            → All tests (CTS, API, GDF, vision)
#
# Both runners use controller-mode:docker, meaning each job runs inside an
# ephemeral Docker container launched by the runner controller.  The
# container: block below passes the AMD GPU devices and group memberships
# required for ROCm/HIP execution:
#
#   --device /dev/kfd       AMD GPU kernel fusion driver (compute)
#   --device /dev/dri       DRI render nodes (renderD*)
#   --group-add video       Traditional GPU group
#   --group-add render      Required on Ubuntu 20+ for non-root GPU access
#
# rocm/dev-ubuntu-24.04 is used because it ships a full ROCm stack
# (amdclang++, HIP runtime, rocminfo) and rocminfo works correctly in it,
# unlike rocm/rocm-terminal which has known /dev/kfd permission issues.
#
# Build-only jobs that do not execute GPU kernels still use the same image
# so the amdclang++ toolchain and ROCm headers are available without any
# extra install step.
# ---------------------------------------------------------------------------

jobs:
  # ===========================================================================
  # Build Stage — all three builds run on gfx1100 in parallel.
  # ===========================================================================

  # Release build of the PR (or push) branch — used by perf-gate
  build-hip:
    name: Build AMD OpenVX (HIP, Release)
    runs-on: linux-shark39-gfx1100-gpu-rocm
    container:
      image: rocm/dev-ubuntu-24.04:latest
      options: --device /dev/kfd --device /dev/dri --group-add video --group-add render
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends build-essential cmake git python3

      - name: Validate ROCm
        run: rocminfo | grep -E 'Agent|Marketing'

      - name: Build AMD OpenVX (HIP backend, Release)
        run: |
          mkdir build && cd build
          cmake .. \
            -DBACKEND=HIP \
            -DCMAKE_C_COMPILER="${ROCM_PATH}/bin/amdclang" \
            -DCMAKE_CXX_COMPILER="${ROCM_PATH}/bin/amdclang++"
          make -j$(nproc)

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-hip
          path: |
            build/lib/
            amd_openvx/openvx/include/
          retention-days: 1

  # Release build of the merge-target branch — used by perf-gate (PR only)
  build-hip-main:
    name: Build AMD OpenVX (HIP, Release, main)
    if: github.event_name == 'pull_request'
    runs-on: linux-shark39-gfx1100-gpu-rocm
    container:
      image: rocm/dev-ubuntu-24.04:latest
      options: --device /dev/kfd --device /dev/dri --group-add video --group-add render
    steps:
      - name: Checkout merge target ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends build-essential cmake git python3

      - name: Validate ROCm
        run: rocminfo | grep -E 'Agent|Marketing'

      - name: Build AMD OpenVX (HIP backend)
        run: |
          mkdir build && cd build
          cmake .. \
            -DBACKEND=HIP \
            -DCMAKE_C_COMPILER="${ROCM_PATH}/bin/amdclang" \
            -DCMAKE_CXX_COMPILER="${ROCM_PATH}/bin/amdclang++"
          make -j$(nproc)

      - name: Upload main build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-hip-main
          path: |
            build/lib/
            amd_openvx/openvx/include/
          retention-days: 1

  # Debug build with LLVM coverage instrumentation — downloaded by gfx1030 test jobs.
  # amdclang supports -fprofile-instr-generate / -fcoverage-mapping so the
  # profraw flow is identical to the CPU workflow.
  build-hip-debug:
    name: Build AMD OpenVX (HIP, Debug + Coverage)
    runs-on: linux-shark39-gfx1100-gpu-rocm
    container:
      image: rocm/dev-ubuntu-24.04:latest
      options: --device /dev/kfd --device /dev/dri --group-add video --group-add render
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends build-essential cmake git python3

      - name: Validate ROCm
        run: rocminfo | grep -E 'Agent|Marketing'

      - name: Build and install AMD OpenVX (HIP, Debug + Coverage)
        env:
          INSTALL_PREFIX: ${{ github.workspace }}/install
        run: |
          mkdir build && cd build
          cmake .. \
            -DBACKEND=HIP \
            -DCODE_COVERAGE=ON \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER="${ROCM_PATH}/bin/amdclang" \
            -DCMAKE_CXX_COMPILER="${ROCM_PATH}/bin/amdclang++" \
            -DCMAKE_INSTALL_PREFIX="$INSTALL_PREFIX"
          make -j$(nproc)
          make install

      - name: Build API tests
        env:
          INSTALL_PREFIX: ${{ github.workspace }}/install
        run: |
          API_TESTS=(
            canny channel_extract color_convert accumulate
            graph graph_api tensor_api data_objects user_kernel
            tensor_advanced threshold_query graph_import vxu_api
            coverage_boost vision_coverage
          )
          for test_dir in "${API_TESTS[@]}"; do
            echo "::group::Building ${test_dir}"
            mkdir -p build/api_tests/${test_dir}
            cmake -S tests/openvx_api_tests/${test_dir} \
                  -B build/api_tests/${test_dir} \
                  -DROCM_PATH="$INSTALL_PREFIX"
            cmake --build build/api_tests/${test_dir} -j$(nproc)
            echo "::endgroup::"
          done

      - name: Clone and build OpenVX CTS
        env:
          INSTALL_PREFIX: ${{ github.workspace }}/install
        run: |
          git clone --depth 1 -b openvx_1.3 https://github.com/KhronosGroup/OpenVX-cts.git
          cd OpenVX-cts
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DOPENVX_INCLUDES="${{ github.workspace }}/amd_openvx/openvx/include" \
            -DOPENVX_LIBRARIES="${INSTALL_PREFIX}/lib/libopenvx.so;${INSTALL_PREFIX}/lib/libvxu.so;pthread;dl;m;rt" \
            -DOPENVX_CONFORMANCE_VISION=ON
          make -j$(nproc)

      - name: Upload debug build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-hip-debug
          path: |
            install/
            build/api_tests/
            OpenVX-cts/build/bin/vx_test_conformance
            OpenVX-cts/build/lib/
            OpenVX-cts/test_data/
          retention-days: 1

  # ===========================================================================
  # Performance Stage — gfx1100 only (PR only).
  # Compares PR vs merge-target on the same GPU runner.
  # ===========================================================================

  perf-gate-hip:
    name: Perf gate HIP (PR vs main)
    if: github.event_name == 'pull_request'
    runs-on: linux-shark39-gfx1100-gpu-rocm
    container:
      image: rocm/dev-ubuntu-24.04:latest
      options: --device /dev/kfd --device /dev/dri --group-add video --group-add render
    needs:
      - build-hip
      - build-hip-main
    steps:
      - name: Checkout repo (for perf_gate.py script)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends build-essential cmake git python3

      - name: Validate ROCm
        run: rocminfo | grep -E 'Agent|Marketing'

      - name: Download PR build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-hip
          path: ${{ github.workspace }}/pr-pkg

      - name: Download main build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-hip-main
          path: ${{ github.workspace }}/main-pkg

      - name: Show artifact layout
        run: find pr-pkg main-pkg -maxdepth 4 | sort

      - name: Clone openvx-mark
        run: |
          git clone --depth 1 https://github.com/kiritigowda/openvx-mark.git \
            ${{ github.workspace }}/openvx-mark

      - name: Build openvx-mark against PR
        run: |
          mkdir -p ${{ github.workspace }}/openvx-mark/build-pr
          cd ${{ github.workspace }}/openvx-mark/build-pr
          cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="${ROCM_PATH}/bin/amdclang" \
            -DCMAKE_CXX_COMPILER="${ROCM_PATH}/bin/amdclang++" \
            -DOPENVX_INCLUDES=${{ github.workspace }}/pr-pkg/amd_openvx/openvx/include \
            -DOPENVX_LIB_DIR=${{ github.workspace }}/pr-pkg/build/lib \
            ..
          cmake --build . -j$(nproc)

      - name: Build openvx-mark against main
        run: |
          mkdir -p ${{ github.workspace }}/openvx-mark/build-main
          cd ${{ github.workspace }}/openvx-mark/build-main
          cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="${ROCM_PATH}/bin/amdclang" \
            -DCMAKE_CXX_COMPILER="${ROCM_PATH}/bin/amdclang++" \
            -DOPENVX_INCLUDES=${{ github.workspace }}/main-pkg/amd_openvx/openvx/include \
            -DOPENVX_LIB_DIR=${{ github.workspace }}/main-pkg/build/lib \
            ..
          cmake --build . -j$(nproc)

      - name: Bench PR (warmup + measure)
        run: |
          cd ${{ github.workspace }}/openvx-mark/build-pr
          export LD_LIBRARY_PATH=${{ github.workspace }}/pr-pkg/build/lib:${ROCM_PATH}/lib
          export AGO_DEFAULT_TARGET=GPU
          ./openvx-mark --validate-timing
          ./openvx-mark --resolution FHD --iterations 5 --warmup 0 --threads 1 \
            --output-dir /tmp/warmup-pr-throwaway >/dev/null 2>&1 || true
          ./openvx-mark --resolution FHD --iterations 20 --warmup 5 --threads 1

      - name: Bench main (warmup + measure)
        run: |
          cd ${{ github.workspace }}/openvx-mark/build-main
          export LD_LIBRARY_PATH=${{ github.workspace }}/main-pkg/build/lib:${ROCM_PATH}/lib
          export AGO_DEFAULT_TARGET=GPU
          ./openvx-mark --validate-timing
          ./openvx-mark --resolution FHD --iterations 5 --warmup 0 --threads 1 \
            --output-dir /tmp/warmup-main-throwaway >/dev/null 2>&1 || true
          ./openvx-mark --resolution FHD --iterations 20 --warmup 5 --threads 1

      - name: Run perf gate
        run: |
          set -euo pipefail
          PR=${{ github.workspace }}/openvx-mark/build-pr/benchmark_results/benchmark_results.json
          MAIN=${{ github.workspace }}/openvx-mark/build-main/benchmark_results/benchmark_results.json
          if [ ! -f "$PR" ] || [ ! -f "$MAIN" ]; then
            echo "::error::Missing benchmark JSONs (PR=$PR, MAIN=$MAIN)."
            ls -la "$(dirname "$PR")" "$(dirname "$MAIN")" 2>/dev/null || true
            exit 1
          fi

          python3 ${{ github.workspace }}/.github/scripts/perf_gate.py \
            "$MAIN" "$PR" \
            --geomean-floor 0.95 \
            --kernel-floor 0.90 \
            --warn-floor 0.95 \
            --max-cv 5.0 \
            --min-abs-ms 2.0 \
            --summary-out "$GITHUB_STEP_SUMMARY"

      - name: Post PR benchmark summary
        if: always()
        run: |
          PR=${{ github.workspace }}/openvx-mark/build-pr/benchmark_results/benchmark_results.json
          if [ ! -f "$PR" ]; then
            echo "_No PR benchmark results found._" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 - "$PR" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          with open(sys.argv[1]) as f:
              report = json.load(f)
          results = report.get("results", [])
          if not results:
              print("_No benchmark results._")
              sys.exit(0)
          print()
          print("---")
          print("## PR Benchmark Summary (HIP / gfx1100)")
          print()
          si = report.get("system", {})
          if si:
              print(f'**Runner:** {si.get("cpu_model", "N/A")} '
                    f'({si.get("cpu_cores", "?")} cores, '
                    f'{si.get("ram_gb", "?")} GB RAM)')
              print()
          print("| Kernel | Mode | Res | MP/s | Median (ms) | CV% | Verified |")
          print("|:---|---|---|---:|---:|---:|:---:|")
          for r in sorted(results, key=lambda x: x.get("name", "")):
              wc = r.get("wall_clock", {}) or {}
              v = "PASS" if r.get("verified", False) else "FAIL"
              print(f'| `{r.get("name","")}` '
                    f'| {r.get("mode","")} '
                    f'| {r.get("resolution","")} '
                    f'| {r.get("megapixels_per_sec", 0):.2f} '
                    f'| {wc.get("median_ms", 0):.3f} '
                    f'| {wc.get("cv_percent", 0):.2f} '
                    f'| {v} |')
          print()
          PY

      - name: Upload PR benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-gate-hip-results-pr
          path: ${{ github.workspace }}/openvx-mark/build-pr/benchmark_results/
          if-no-files-found: ignore

      - name: Upload main benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-gate-hip-results-main
          path: ${{ github.workspace }}/openvx-mark/build-main/benchmark_results/
          if-no-files-found: ignore

  # ===========================================================================
  # Test Stage — all jobs run on gfx1030 against the debug+coverage build.
  # AGO_DEFAULT_TARGET=GPU routes execution through the HIP backend.
  # Each job uploads profraw files for the coverage-summary-hip job.
  # ===========================================================================

  # --- CTS Tests ---

  baseline-hip:
    name: Baseline (HIP)
    runs-on: linux-shark39-gfx1030-gpu-rocm
    container:
      image: rocm/dev-ubuntu-24.04:latest
      options: --device /dev/kfd --device /dev/dri --group-add video --group-add render
    needs: build-hip-debug
    steps:
      - uses: actions/checkout@v4
      - name: Download debug build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-hip-debug
      - name: Validate ROCm
        run: rocminfo | grep -E 'Agent|Marketing'
      - name: Run baseline tests
        run: |
          mkdir -p profraw
          chmod +x OpenVX-cts/build/bin/vx_test_conformance
          cd OpenVX-cts/build
          export LD_LIBRARY_PATH=${{ github.workspace }}/install/lib:${ROCM_PATH}/lib:${{ github.workspace }}/OpenVX-cts/build/lib
          export VX_TEST_DATA_PATH=${{ github.workspace }}/OpenVX-cts/test_data/
          export AGO_DEFAULT_TARGET=GPU
          export LLVM_PROFILE_FILE=${{ github.workspace }}/profraw/baseline_%p.profraw
          timeout 300 ./bin/vx_test_conformance --filter="GraphBase.*:Logging.*:SmokeTestBase.*:SmokeTest.*:TargetBase.*:Target.*"
      - name: Upload profraw
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profraw-hip-baseline
          path: profraw/
          if-no-files-found: ignore

  graph-hip:
    name: Graph (HIP)
    runs-on: linux-shark39-gfx1030-gpu-rocm
    container:
      image: rocm/dev-ubuntu-24.04:latest
      options: --device /dev/kfd --device /dev/dri --group-add video --group-add render
    needs: build-hip-debug
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Download debug build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-hip-debug
      - name: Validate ROCm
        run: rocminfo | grep -E 'Agent|Marketing'
      - name: Run graph tests
        run: |
          mkdir -p profraw
          chmod +x OpenVX-cts/build/bin/vx_test_conformance
          cd OpenVX-cts/build
          export LD_LIBRARY_PATH=${{ github.workspace }}/install/lib:${ROCM_PATH}/lib:${{ github.workspace }}/OpenVX-cts/build/lib
          export VX_TEST_DATA_PATH=${{ github.workspace }}/OpenVX-cts/test_data/
          export AGO_DEFAULT_TARGET=GPU
          export LLVM_PROFILE_FILE=${{ github.workspace }}/profraw/graph_%p.profraw
          timeout 600 ./bin/vx_test_conformance --filter="Graph.*:GraphCallback.*:GraphDelay.*:GraphROI.*:UserNode.*"
      - name: Upload profraw
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profraw-hip-graph
          path: profraw/
          if-no-files-found: ignore

  data-objects-hip:
    name: Data objects (HIP)
    runs-on: linux-shark39-gfx1030-gpu-rocm
    container:
      image: rocm/dev-ubuntu-24.04:latest
      options: --device /dev/kfd --device /dev/dri --group-add video --group-add render
    needs: build-hip-debug
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Download debug build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-hip-debug
      - name: Validate ROCm
        run: rocminfo | grep -E 'Agent|Marketing'
      - name: Run data object tests
        run: |
          mkdir -p profraw
          chmod +x OpenVX-cts/build/bin/vx_test_conformance
          cd OpenVX-cts/build
          export LD_LIBRARY_PATH=${{ github.workspace }}/install/lib:${ROCM_PATH}/lib:${{ github.workspace }}/OpenVX-cts/build/lib
          export VX_TEST_DATA_PATH=${{ github.workspace }}/OpenVX-cts/test_data/
          export AGO_DEFAULT_TARGET=GPU
          export LLVM_PROFILE_FILE=${{ github.workspace }}/profraw/data_objects_%p.profraw
          timeout 300 ./bin/vx_test_conformance --filter="Scalar.*:Array.*:ObjectArray.*:Matrix.*:Convolution.*:Distribution.*:LUT.*:Histogram.*"
      - name: Upload profraw
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profraw-hip-data-objects
          path: profraw/
          if-no-files-found: ignore

  image-ops-hip:
    name: Image ops (HIP)
    runs-on: linux-shark39-gfx1030-gpu-rocm
    container:
      image: rocm/dev-ubuntu-24.04:latest
      options: --device /dev/kfd --device /dev/dri --group-add video --group-add render
    needs: build-hip-debug
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Download debug build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-hip-debug
      - name: Validate ROCm
        run: rocminfo | grep -E 'Agent|Marketing'
      - name: Run image operation tests
        run: |
          mkdir -p profraw
          chmod +x OpenVX-cts/build/bin/vx_test_conformance
          cd OpenVX-cts/build
          export LD_LIBRARY_PATH=${{ github.workspace }}/install/lib:${ROCM_PATH}/lib:${{ github.workspace }}/OpenVX-cts/build/lib
          export VX_TEST_DATA_PATH=${{ github.workspace }}/OpenVX-cts/test_data/
          export AGO_DEFAULT_TARGET=GPU
          export LLVM_PROFILE_FILE=${{ github.workspace }}/profraw/image_ops_%p.profraw
          timeout 600 ./bin/vx_test_conformance --filter="Image.*:vxCopyImagePatch.*:vxMapImagePatch.*:vxCreateImageFromChannel.*:vxCopyRemapPatch.*:vxMapRemapPatch.*"
      - name: Upload profraw
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profraw-hip-image-ops
          path: profraw/
          if-no-files-found: ignore

  vision-color-hip:
    name: Vision color (HIP)
    runs-on: linux-shark39-gfx1030-gpu-rocm
    container:
      image: rocm/dev-ubuntu-24.04:latest
      options: --device /dev/kfd --device /dev/dri --group-add video --group-add render
    needs: build-hip-debug
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Download debug build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-hip-debug
      - name: Validate ROCm
        run: rocminfo | grep -E 'Agent|Marketing'
      - name: Run color and channel tests
        run: |
          mkdir -p profraw
          chmod +x OpenVX-cts/build/bin/vx_test_conformance
          cd OpenVX-cts/build
          export LD_LIBRARY_PATH=${{ github.workspace }}/install/lib:${ROCM_PATH}/lib:${{ github.workspace }}/OpenVX-cts/build/lib
          export VX_TEST_DATA_PATH=${{ github.workspace }}/OpenVX-cts/test_data/
          export AGO_DEFAULT_TARGET=GPU
          export LLVM_PROFILE_FILE=${{ github.workspace }}/profraw/vision_color_%p.profraw
          timeout 300 ./bin/vx_test_conformance --filter="ColorConvert.*:ChannelExtract.*:ChannelCombine.*:vxConvertDepth.*:vxuConvertDepth.*"
      - name: Upload profraw
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profraw-hip-vision-color
          path: profraw/
          if-no-files-found: ignore

  vision-filters-hip:
    name: Vision filters (HIP)
    runs-on: linux-shark39-gfx1030-gpu-rocm
    container:
      image: rocm/dev-ubuntu-24.04:latest
      options: --device /dev/kfd --device /dev/dri --group-add video --group-add render
    needs: build-hip-debug
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Download debug build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-hip-debug
      - name: Validate ROCm
        run: rocminfo | grep -E 'Agent|Marketing'
      - name: Run filter and morphology tests
        run: |
          mkdir -p profraw
          chmod +x OpenVX-cts/build/bin/vx_test_conformance
          cd OpenVX-cts/build
          export LD_LIBRARY_PATH=${{ github.workspace }}/install/lib:${ROCM_PATH}/lib:${{ github.workspace }}/OpenVX-cts/build/lib
          export VX_TEST_DATA_PATH=${{ github.workspace }}/OpenVX-cts/test_data/
          export AGO_DEFAULT_TARGET=GPU
          export LLVM_PROFILE_FILE=${{ github.workspace }}/profraw/vision_filters_%p.profraw
          timeout 600 ./bin/vx_test_conformance --filter="Box3x3.*:Gaussian3x3.*:Median3x3.*:Dilate3x3.*:Erode3x3.*:Sobel3x3.*:Magnitude.*:Phase.*:NonLinearFilter.*:Convolve.*:EqualizeHistogram.*"
      - name: Upload profraw
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profraw-hip-vision-filters
          path: profraw/
          if-no-files-found: ignore

